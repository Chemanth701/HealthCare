services:
  - type: web
    name: pulse-care-healthcare
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: healthcare
      - key: ADMIN_EMAIL
        sync: false
