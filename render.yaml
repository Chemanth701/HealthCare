services:
  - type: web
    name: pulse-care-healthcare
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: healthcare
      - key: ADMIN_EMAIL
        sync: false
