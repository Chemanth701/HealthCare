<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Care — Emergency ID</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f6ff;color:#18213b;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border:1px solid #e4e8f3;border-radius:28px;padding:28px;box-shadow:0 25px 70px #24306018}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#ffe9e7;color:#c0392b;font-weight:800;font-size:12px}.hero{display:flex;gap:16px;align-items:center;margin:18px 0;padding:18px;background:#f7f8ff;border-radius:20px}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#5b57e8,#45a9f5);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:14px;border:1px solid #e4e8f3;border-radius:16px}.item small{display:block;color:#7b849b;font-weight:700;margin-bottom:4px}.item b{word-break:break-word}.med{padding:10px 0;border-bottom:1px solid #eef0f6}.muted{color:#7b849b}.error{color:#b42318;background:#fff0ef;padding:14px;border-radius:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><span class="badge">EMERGENCY MEDICAL ID</span><div id="app"><p class="muted">Loading emergency profile…</p></div><p class="muted" style="margin-top:20px;font-size:12px">This page shows only information the account holder chose to share. For immediate danger, call local emergency services.</p></main><script>const token=new URLSearchParams(location.search).get('token');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/emergency/public/'+encodeURIComponent(token||''),{cache:'no-store'}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Profile unavailable');const initials=(x.name||'PC').split(/\\s+/).slice(0,2).map(v=>v[0]).join('').toUpperCase();document.querySelector('#app').innerHTML='<div class="hero"><div class="avatar">'+esc(initials)+'</div><div><h1 style="margin:0 0 3px">'+esc(x.name||'Name not provided')+'</h1><div class="muted">Emergency profile</div></div></div><div class="grid"><div class="item"><small>Blood group</small><b>'+esc(x.bloodGroup||'Not listed')+'</b></div><div class="item"><small>Emergency contact</small><b>'+esc(x.emergencyContact||'Not listed')+'</b><div class="muted">'+esc(x.emergencyPhone||'')+'</div></div><div class="item"><small>Allergies</small><b>'+esc(x.allergies||'None listed')+'</b></div><div class="item"><small>Medical conditions</small><b>'+esc(x.conditions||'None listed')+'</b></div></div><section style="margin-top:18px"><h2 style="font-size:16px">Current medications</h2>'+(x.medications?.length?x.medications.map(m=>'<div class="med"><b>'+esc(m.name)+'</b> <span class="muted">'+esc(m.dose||'')+'</span><div class="muted">'+esc(m.time||'')+'</div></div>').join(''):'<p class="muted">None listed</p>')+'</section>'}).catch(e=>document.querySelector('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>');</script></body></html>
