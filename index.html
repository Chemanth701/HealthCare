<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Pulse Care personal health dashboard">
<link rel="manifest" href="/manifest.json">
<title>Pulse Care — Health Dashboard</title>
<style>
:root{--bg:#f5f7ff;--surface:#fff;--surface2:#f8f9ff;--ink:#17203a;--mut:#77809a;--line:#e7eaf4;--primary:#5b57e8;--primary2:#7b61ff;--soft:#ecebff;--blue:#3b82f6;--green:#22b573;--red:#ef5350;--amber:#f4a62a;--shadow:0 18px 50px rgba(48,55,120,.09);--radius:24px}
:root[data-theme=dark]{--bg:#0d1020;--surface:#171a2d;--surface2:#1c2036;--ink:#f5f6ff;--mut:#9da4bd;--line:#292e47;--primary:#8b83ff;--primary2:#6d7cff;--soft:#282650;--blue:#65a4ff;--green:#47d79a;--red:#ff7c79;--amber:#ffc35d;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 10px 22px #5b57e82b}.brand strong{font-size:19px;letter-spacing:-.02em}.brand small{display:block;color:var(--mut);font-size:11px;margin-top:-2px}
.side-label{padding:12px 12px 8px;color:#a0a6bb;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.12em}.side-nav{display:grid;gap:5px}.side-nav button,.side-nav .nav-btn{background:transparent;color:var(--mut);text-align:left;padding:12px 13px;border-radius:14px;font-weight:700;display:flex;align-items:center;gap:12px;text-decoration:none;border:0;font:inherit;cursor:pointer}.side-nav button:hover,.side-nav .nav-btn:hover{background:var(--surface2);color:var(--ink)}.side-nav button.on,.side-nav .nav-btn.on{background:var(--soft);color:var(--primary)}.ico{width:20px;text-align:center;font-size:17px}
.side-bottom{margin-top:auto}.profile-mini{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:16px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a7b4ff,#6158e8);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.profile-mini div{min-width:0}.profile-mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-mini span{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0}.content{max-width:1420px;margin:auto;padding:26px 34px 50px}.mobile-top{display:none}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.page-head h1{font-size:30px;letter-spacing:-.035em;margin:2px 0 4px}.muted{color:var(--mut)}.actions{display:flex;align-items:center;gap:9px}
.btn{border-radius:13px;padding:11px 16px;font-weight:800;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 10px 22px #5b57e82b}.btn.soft{background:var(--soft);color:var(--primary);border-color:transparent}.btn.danger{background:#fff0ef;color:var(--red)}.btn.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:13px}
.grid{display:grid;gap:18px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0}.card h3{font-size:15px}.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.tiny{font-size:11px;color:var(--mut)}
.hero{min-height:265px;border:0;overflow:hidden;position:relative;color:#fff;background:linear-gradient(135deg,#5b57e8 0%,#7565f3 50%,#45a9f5 100%);box-shadow:0 22px 50px #5b57e82b}.hero:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-100px;top:-150px;background:#ffffff18}.hero-content{position:relative;z-index:1;max-width:62%}.hero h2{font-size:32px;line-height:1.08;letter-spacing:-.04em;margin:8px 0 10px}.hero p{color:#e9eaff;margin:0 0 22px}.hero-art{position:absolute;right:28px;bottom:0;width:300px;height:230px}.orb{position:absolute;border-radius:50%;filter:blur(.2px)}.orb.one{width:185px;height:185px;right:35px;bottom:-20px;background:radial-gradient(circle at 35% 30%,#fff8,#b6b2ff 20%,#4541b9 75%)}.orb.two{width:115px;height:115px;right:145px;bottom:75px;background:linear-gradient(135deg,#a7f3ff,#5d63ed);opacity:.8}.orb.three{width:58px;height:58px;right:88px;bottom:115px;background:#fff8;box-shadow:0 0 50px #fff}
.stat-card{display:flex;align-items:center;gap:14px}.stat-icon{width:48px;height:48px;border-radius:16px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:21px}.stat-card b{font-size:24px;letter-spacing:-.04em}.stat-card p{margin:1px 0 0;color:var(--mut);font-size:12px}
.metric{display:flex;align-items:center;justify-content:space-between;gap:12px}.metric-left{display:flex;align-items:center;gap:12px}.metric-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eef4ff;color:var(--blue)}.metric-icon.green{background:#e8faf3;color:var(--green)}.metric-icon.red{background:#fff0ef;color:var(--red)}.metric-icon.amber{background:#fff7e6;color:var(--amber)}.metric-value{font-weight:900;font-size:18px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900}.pill.ok{background:#e7f9f0;color:var(--green)}.pill.warn{background:#fff4db;color:#a86b00}.pill.bad{background:#ffe9e7;color:var(--red)}
.chart{height:100px;display:flex;align-items:flex-end;gap:7px;padding:8px 2px 0}.chart span{flex:1;min-width:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--primary2),#b5b0ff);opacity:.85}.empty{padding:26px;text-align:center;color:var(--mut);background:var(--surface2);border-radius:18px}
.section{margin-top:22px}.section h2{font-size:18px;letter-spacing:-.02em;margin:0 0 12px}.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);gap:18px}
.profile-banner{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface2);border-radius:20px}.profile-banner .avatar{width:58px;height:58px;font-size:20px}.profile-banner h2{font-size:21px}.profile-banner p{margin:2px 0 0}
.field{margin-top:12px}.field label{display:block;color:var(--mut);font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--ink)}.field textarea{resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.form-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:10px}.list-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.list-row .grow{flex:1;min-width:0}.list-row h3{font-size:14px}.list-row p{margin:2px 0 0;color:var(--mut);font-size:12px}
.doctor{display:flex;align-items:center;gap:14px}.doctor-photo{width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#cfd8ff,#6860e8);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}.doctor-info{flex:1}.doctor-info b{display:block}.doctor-info span{display:block;color:var(--mut);font-size:12px}.availability{font-size:10px;font-weight:900;color:var(--green);background:#e7f9f0;padding:5px 8px;border-radius:999px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:99px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 10% 20%,#dcdcff 0,transparent 28%),radial-gradient(circle at 90% 80%,#c9ecff 0,transparent 28%),var(--bg)}.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 25px 80px #3c419b18}.auth-logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--blue));display:grid;place-items:center;color:#fff;font-size:25px;margin-bottom:18px}.auth-card h1{font-size:30px;letter-spacing:-.04em;margin:0}.auth-card .switch{text-align:center;margin-top:16px}.auth-card .err{color:var(--red);font-weight:700;min-height:20px;margin-top:10px}
.bottom-nav{display:none}.toast{position:fixed;z-index:50;left:50%;bottom:28px;transform:translateX(-50%);background:#15192c;color:#fff;padding:11px 16px;border-radius:13px;box-shadow:0 12px 30px #0003}
@media(max-width:1050px){.app-shell{grid-template-columns:210px 1fr}.content{padding:22px}.grid-4{grid-template-columns:repeat(2,1fr)}.hero-art{opacity:.8}.two-col{grid-template-columns:1fr}}
@media(max-width:760px){.app-shell{display:block}.sidebar{display:none}.content{padding:14px 14px 90px}.mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.mobile-top .brand{padding:0}.page-head{margin-bottom:16px}.page-head h1{font-size:25px}.page-head .actions .hide-mobile{display:none}.hero{min-height:285px}.hero-content{max-width:100%}.hero h2{font-size:29px}.hero-art{width:240px;height:170px;right:-20px;bottom:-8px;opacity:.5}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.stat-card{min-height:84px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.bottom-nav{display:flex;position:fixed;z-index:30;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:7px;box-shadow:0 18px 50px #1d245226}.bottom-nav button{flex:1;background:transparent;color:var(--mut);border-radius:15px;padding:7px 2px;font-size:10px;font-weight:800}.bottom-nav button.on{background:var(--soft);color:var(--primary)}.bottom-nav .ico{display:block;font-size:17px}.card{border-radius:20px;padding:17px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY='pulsecare_v1',TODAY=()=>new Date().toISOString().slice(0,10);
const R={hr:['Heart rate','bpm',50,100],sys:['Systolic','mmHg',90,130],dia:['Diastolic','mmHg',60,85],glu:['Glucose','mg/dL',70,140],spo2:['Oxygen','%',95,100],wt:['Weight','kg',0,999]};
const DEF={profile:{name:'',blood:'',allergies:'',conditions:'',contact:'',contactPhone:''},vitals:[],meds:[],appts:[],checkins:{},tab:'today',updatedAt:0};
const clone=o=>JSON.parse(JSON.stringify(o));let S=load(),syncState='local',busy=false,timer,AUTH=null,authMode='login';
function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(DEF)}}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(n){return (String(n||'PC').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'PC').toUpperCase()}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function setSync(x){syncState=x;let e=document.querySelector('#syncStatus');if(e)e.textContent={synced:'● Synced',syncing:'● Syncing…',offline:'● Offline',local:'● Local only'}[x]||x}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}clearTimeout(timer);timer=setTimeout(push,400)}
async function push(){if(busy||!navigator.onLine||!AUTH)return;busy=true;setSync('syncing');try{let r=await fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(S)});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;setSync('synced')}catch{setSync('offline')}finally{busy=false}}
async function pull(){if(!navigator.onLine||!AUTH)return setSync('offline');setSync('syncing');try{let r=await fetch('/api/state',{credentials:'same-origin'});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;let x=await r.json();if(x.state&&Number(x.updatedAt||0)>Number(S.updatedAt||0)){S=Object.assign(clone(DEF),x.state);localStorage.setItem(KEY,JSON.stringify(S));render()}setSync('synced')}catch{setSync('offline')}}
addEventListener('online',pull);addEventListener('offline',()=>setSync('offline'));

function last(k){let a=S.vitals.filter(v=>v.k===k);return a[a.length-1]}
function series(k){return S.vitals.filter(v=>v.k===k).slice(-14).map(v=>v.v)}
function status(k,v){let r=R[k];if(k==='wt')return['ok','Logged'];if(v<r[2])return['warn','Low'];if(v>r[3])return['bad','High'];return['ok','In range']}
function adherence(){if(!S.meds.length)return null;let t=TODAY();return Math.round(S.meds.filter(m=>m.taken&&m.taken[t]).length/S.meds.length*100)}
function score(){let a=[],ad=adherence();if(ad!==null)a.push(ad);['hr','sys','dia','glu','spo2'].forEach(k=>{let x=last(k);if(x)a.push(status(k,x.v)[0]==='ok'?100:55)});let c=S.checkins[TODAY()];if(c)a.push((c.mood+c.sleep)*10);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
function bars(k){let a=series(k);if(!a.length)return '<div class="empty">No readings yet</div>';let mx=Math.max(...a),mn=Math.min(...a),d=mx-mn||1;return '<div class="chart">'+a.map(v=>'<span style="height:'+Math.max(12,22+((v-mn)/d)*72)+'%"></span>').join('')+'</div>'}
function insights(){let o=[];['hr','sys','glu'].forEach(k=>{let a=series(k);if(a.length>=4){let r=a.slice(-3).reduce((x,y)=>x+y)/3,b=a.slice(0,-3).reduce((x,y)=>x+y)/(a.length-3),ch=(r-b)/b*100;if(Math.abs(ch)>=8)o.push({t:R[k][0]+' is '+(ch>0?'up ':'down ')+Math.abs(ch).toFixed(0)+'% versus earlier readings.',c:Math.abs(ch)>15?'bad':'warn'})}});let ad=adherence();if(ad!==null&&ad<100&&new Date().getHours()>=20)o.push({t:'Some medicines are not marked as taken today.',c:'warn'});if(!o.length)o.push({t:S.vitals.length?'No unusual changes detected in recent readings.':'Log a reading to start seeing trends.',c:'ok'});return o}

function authRender(){document.body.innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="auth-logo">♥</div><p class="eyebrow">Pulse Care</p><h1>${authMode==='login'?'Welcome back':'Create your account'}</h1><p class="muted">A calm, private place to keep your health information organized.</p><div class="field"><label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="ap" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="At least 8 characters"></div><div id="ae2" class="err" role="alert"></div><button class="btn primary" style="width:100%;margin-top:4px" onclick="authSubmit()">${authMode==='login'?'Sign in':'Create account'}</button><div class="switch"><button class="btn soft" onclick="authMode=authMode==='login'?'register':'login';authRender()">${authMode==='login'?'New here? Create an account':'Already have an account? Sign in'}</button></div></div></div>`}
async function authSubmit(){let email=document.querySelector('#ae').value.trim(),password=document.querySelector('#ap').value,err=document.querySelector('#ae2');err.textContent='';try{let r=await fetch('/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})}),x=await r.json();if(!r.ok)throw Error(x.error||'Authentication failed');AUTH=x;S=load();render();pull()}catch(e){err.textContent=e.message}}
async function bootAuth(){try{let r=await fetch('/api/auth/me',{credentials:'same-origin'});if(!r.ok)throw 0;AUTH=await r.json();render();pull()}catch{authRender()}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});AUTH=null;authRender()}
function theme(){let d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('pulsecare_theme',d?'light':'dark')}

const tabs=[['today','⌂','Overview'],['vitals','♥','Vitals'],['meds','✚','Medicines'],['care','◫','Appointments'],['id','▣','Emergency']];
function navHTML(){return tabs.map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')" '+(S.tab===x[0]?'aria-current="page"':'')+'><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('')}
function shell(content){let name=S.profile.name||'My profile';return '<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">♥</div><div><strong>Pulse Care</strong><small>Personal health</small></div></div><div class="side-label">Workspace</div><div class="side-nav">'+navHTML()+'</div><div class="side-label">Preferences</div><div class="side-nav"><button onclick="theme()"><span class="ico">◐</span>Appearance</button><a class="nav-btn" href="/legal.html#privacy"><span class="ico">⌕</span>Privacy Policy</a><a class="nav-btn" href="/legal.html#terms"><span class="ico">✓</span>Terms & Conditions</a></div><div class="side-bottom"><div class="profile-mini"><div class="avatar">'+initials(name)+'</div><div><b>'+esc(name)+'</b><span>'+(AUTH?esc(AUTH.email):'')+'</span></div><button class="btn icon" title="Sign out" onclick="logout()">↪</button></div></div></aside><main class="main"><div class="content"><div class="mobile-top"><div class="brand"><div class="brand-logo">♥</div><div><strong>Pulse Care</strong><small>Personal health</small></div></div><button class="btn icon" onclick="theme()">◐</button></div>'+content+'</div></main></div><div class="bottom-nav">'+navHTML()+'</div>'}

function pageHead(kicker,title,sub,action){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="actions">'+(action||'')+'</div></div>'}

function today(){let name=S.profile.name||'there',sc=score(),ad=adherence(),next=S.appts.filter(a=>a.date>=TODAY()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],c=S.checkins[TODAY()],h=new Date().getHours();let greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';return pageHead('Health overview',greet+', '+esc(name),'Here is your health journey for today.','<span id="syncStatus" class="tiny">● Local only</span> <button class="btn icon" onclick="logout()" title="Sign out">↪</button>')+'<div class="hero card"><div class="hero-content"><span class="pill" style="background:#ffffff22;color:#fff">Today • '+TODAY()+'</span><h2>Take care of your<br>health, one day at a time.</h2><p>Your personal dashboard brings your vitals, medicines and care plan together.</p><button class="btn" style="background:#fff;color:#4f46e5;border:0" onclick="go(\'vitals\')">Log a reading →</button></div><div class="hero-art"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div></div><div class="section"><div class="grid grid-4"><div class="card stat-card"><div class="stat-icon">♥</div><div><b>'+(S.vitals.length||0)+'</b><p>Total readings</p></div></div><div class="card stat-card"><div class="stat-icon">✚</div><div><b>'+(S.meds.length||0)+'</b><p>Medicines</p></div></div><div class="card stat-card"><div class="stat-icon">◷</div><div><b>'+S.appts.length+'</b><p>Appointments</p></div></div><div class="card stat-card"><div class="stat-icon">★</div><div><b>'+(sc??'—')+'</b><p>Health score</p></div></div></div></div><div class="section two-col"><div class="grid"><div class="card"><div class="card-title"><div><h3>Health journey</h3><span class="tiny">A simple snapshot from your logged data</span></div><span class="pill '+(sc!==null?'ok':'warn')+'">'+(sc!==null?'Updated':'Start logging')+'</span></div><div class="grid grid-2"><div><div class="tiny">Health score</div><div style="font-size:38px;font-weight:900;letter-spacing:-.06em">'+(sc??'—')+'<span style="font-size:14px;color:var(--mut)"> / 100</span></div><div class="progress"><i style="width:'+(sc||0)+'%"></i></div></div><div><div class="tiny">Medicine adherence</div><div style="font-size:38px;font-weight:900;letter-spacing:-.06em">'+(ad!==null?ad:'—')+(ad!==null?'%':'')+'</div><div class="progress"><i style="width:'+(ad||0)+'%"></i></div></div></div></div><div class="card"><div class="card-title"><div><h3>What we noticed</h3><span class="tiny">Recent patterns</span></div></div>'+insights().map(i=>'<div class="list-row"><span class="pill '+i.c+'">'+(i.c==='ok'?'Good':i.c==='warn'?'Watch':'Act')+'</span><div class="grow">'+esc(i.t)+'</div></div>').join('')+'</div></div><div class="grid"><div class="card"><div class="card-title"><h3>Next appointment</h3><button class="btn soft" onclick="go(\'care\')">View all</button></div>'+(next?'<div class="doctor"><div class="doctor-photo">'+initials(next.doc)+'</div><div class="doctor-info"><b>'+esc(next.doc)+'</b><span>'+next.date+' · '+esc(next.time||'Time not set')+'</span></div><span class="availability">Scheduled</span></div>':'<div class="empty">No upcoming appointments.<br><button class="btn primary" style="margin-top:10px" onclick="go(\'care\')">Book appointment</button></div>')+'</div><div class="card"><div class="card-title"><h3>Daily check-in</h3><span class="tiny">Today</span></div><div class="form-grid"><div class="field"><label>Mood 1–5</label><input id="mood" type="number" min="1" max="5" value="'+(c?.mood||3)+'"></div><div class="field"><label>Sleep 1–5</label><input id="slp" type="number" min="1" max="5" value="'+(c?.sleep||3)+'"></div></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="checkin()">Save check-in</button></div></div></div>'}

function vitals(){let cards=['hr','sys','dia','glu','spo2','wt'].map(k=>{let x=last(k);if(!x)return '<div class="card"><div class="metric"><div class="metric-left"><div class="metric-icon">•</div><div><h3>'+R[k][0]+'</h3><div class="tiny">No reading yet</div></div></div></div></div>';let st=status(k,x.v);return '<div class="card"><div class="metric"><div class="metric-left"><div class="metric-icon '+(st[0]==='bad'?'red':st[0]==='warn'?'amber':'')+'">♥</div><div><h3>'+R[k][0]+'</h3><div class="tiny">'+new Date(x.t).toLocaleString()+'</div></div></div><div style="text-align:right"><div class="metric-value">'+x.v+' <span class="tiny">'+R[k][1]+'</span></div><span class="pill '+st[0]+'">'+st[1]+'</span></div></div>'+bars(k)+'</div>'}).join('');return pageHead('Health tracking','Vitals','Record readings and keep an eye on recent trends.')+'<div class="card"><div class="card-title"><div><h3>Log a new reading</h3><span class="tiny">Blood pressure supports the 120/80 format.</span></div></div><div class="form-grid"><div class="field"><label>Reading type</label><select id="vk"><option value="hr">Heart rate</option><option value="bp">Blood pressure</option><option value="glu">Glucose</option><option value="spo2">Oxygen saturation</option><option value="wt">Weight</option></select></div><div class="field"><label>Value</label><input id="vv" inputmode="decimal" placeholder="72 or 120/80"></div></div><div class="form-actions"><button class="btn primary" onclick="addV()">Save reading</button><button class="btn" onclick="quick()">Quick text</button><button class="btn" onclick="voice()">Voice input</button></div><input id="qt" style="margin-top:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--ink)" placeholder="Try: pulse 72 or blood pressure 120 over 80"></div><div class="section"><div class="grid grid-2">'+cards+'</div></div>'}

function meds(){return pageHead('Medication','Medicines','Track your schedule and mark doses as taken.')+'<div class="two-col"><div class="card"><div class="card-title"><div><h3>Today’s medicines</h3><span class="tiny">Tracking only — follow your clinician’s instructions.</span></div><span class="pill '+(adherence()===100?'ok':'warn')+'">'+(adherence()??0)+'% done</span></div><div class="list">'+(S.meds.length?S.meds.map((m,i)=>{let d=m.taken?.[TODAY()];return '<div class="list-row"><button class="btn '+(d?'primary':'soft')+'" style="width:40px;height:40px;padding:0" onclick="tick('+i+')">'+(d?'✓':'○')+'</button><div class="grow"><h3>'+esc(m.name)+'</h3><p>'+esc(m.dose||'Dose not set')+' · '+esc(m.time||'Time not set')+'</p></div><button class="btn danger" onclick="delMed('+i+')">Delete</button></div>'}).join(''):'<div class="empty">No medicines added yet.</div>')+'</div></div><div class="card"><div class="card-title"><h3>Add medicine</h3></div><div class="field"><label>Medicine name</label><input id="mn" placeholder="e.g. Vitamin C"></div><div class="form-grid"><div class="field"><label>Dose</label><input id="md" placeholder="e.g. 500 mg"></div><div class="field"><label>Time</label><input id="mt" type="time" value="08:00"></div></div><div class="form-actions"><button class="btn primary" onclick="addMed()">Add medicine</button><button class="btn" onclick="checkInter(true)">Check interactions</button></div></div></div>'}

function care(){return pageHead('Care center','Appointments & guidance','Organize visits and use conservative symptom guidance.')+'<div class="two-col"><div class="card"><div class="card-title"><div><h3>Your appointments</h3><span class="tiny">Upcoming care visits</span></div><span class="pill ok">'+S.appts.length+' total</span></div><div class="list">'+(S.appts.length?S.appts.map((a,i)=>'<div class="list-row"><div class="doctor-photo">'+initials(a.doc)+'</div><div class="grow"><h3>'+esc(a.doc)+'</h3><p>'+a.date+' · '+esc(a.time||'Time not set')+(a.note?' · '+esc(a.note):'')+'</p></div><button class="btn danger" onclick="delAp('+i+')">Delete</button></div>').join(''):'<div class="empty">No appointments scheduled.</div>')+'</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Doctor or clinic</label><input id="ad" placeholder="Dr. Emily Peterson"></div><div class="field"><label>Date</label><input id="ai" type="date" min="'+TODAY()+'"></div><div class="field"><label>Time</label><input id="at" type="time"></div><div class="field"><label>Note</label><input id="an" placeholder="Optional"></div></div><button class="btn primary" style="margin-top:12px" onclick="addAp()">Book appointment</button></div><div class="grid"><div class="card"><div class="card-title"><h3>Symptom guidance</h3><span class="pill warn">Not a diagnosis</span></div><div class="field"><label>What are you feeling?</label><textarea id="sx" rows="5" placeholder="Describe symptoms and when they started"></textarea></div><button class="btn primary" style="margin-top:10px" onclick="triage()">Check urgency</button><div id="tr"></div></div><div class="card"><div class="card-title"><h3>Wellness reset</h3><span class="tiny">60 seconds</span></div><div id="br" style="width:125px;height:125px;margin:12px auto;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary);font-weight:900;transition:transform 4s ease">Ready</div><button class="btn soft" style="width:100%" onclick="breathe()">Start breathing</button></div></div></div>'}

function emergency(){let p=S.profile;return pageHead('Safety','Emergency ID','Keep these details current for quick reference.','<button class="btn" onclick="exp()">Export</button>')+'<div class="two-col"><div class="card" style="border:1px solid #ffd3d0"><div class="profile-banner"><div class="avatar">'+initials(p.name)+'</div><div><h2>'+esc(p.name||'Name not set')+'</h2><p>Blood group: <b>'+esc(p.blood||'?')+'</b></p></div></div><div class="grid grid-2" style="margin-top:16px"><div><div class="tiny">Allergies</div><b>'+esc(p.allergies||'None listed')+'</b></div><div><div class="tiny">Conditions</div><b>'+esc(p.conditions||'None listed')+'</b></div></div><div class="card" style="margin-top:16px;background:#fff3f2;border-color:#ffd3d0"><div class="tiny">Emergency contact</div><h3>'+esc(p.contact||'Not set')+'</h3><p class="muted">'+esc(p.contactPhone||'No phone number')+'</p>'+(p.contactPhone?'<a href="tel:'+esc(p.contactPhone)+'"><button class="btn danger">Call contact</button></a>':'')+'</div><div class="card" style="margin-top:12px;background:#fff3f2;border-color:#ffd3d0"><h3>India emergency services</h3><p class="muted">For an emergency, call 112.</p><a href="tel:112"><button class="btn danger">Call 112</button></a></div></div><div class="card"><div class="card-title"><div><h3>Medical ID details</h3><span class="tiny">Update when anything changes.</span></div></div><div class="form-grid">'+[['name','Full name'],['blood','Blood group'],['allergies','Allergies'],['conditions','Conditions'],['contact','Emergency contact name'],['contactPhone','Emergency contact phone']].map(x=>'<div class="field"><label>'+x[1]+'</label><input id="p_'+x[0]+'" value="'+esc(p[x[0]])+'"></div>').join('')+'</div><button class="btn primary" style="margin-top:14px" onclick="saveP()">Save details</button><div class="section"><div class="card" style="background:var(--surface2)"><h3>Data controls</h3><p class="muted">Your local copy can be exported or erased. When online, your signed-in account can sync data to the server.</p><button class="btn" onclick="exp()">Export JSON</button><button class="btn danger" style="margin-left:6px" onclick="erase()">Erase local data</button></div></div></div></div>'}

function render(){let body=S.tab==='today'?today():S.tab==='vitals'?vitals():S.tab==='meds'?meds():S.tab==='care'?care():emergency();document.body.innerHTML='<div id="root">'+shell(body)+'</div>';if(S.tab==='today')setSync(syncState);scrollTo(0,0)}
function go(x){S.tab=x;save();render()}
function checkin(){let m=Math.max(1,Math.min(5,+document.querySelector('#mood').value||3)),s=Math.max(1,Math.min(5,+document.querySelector('#slp').value||3));S.checkins[TODAY()]={mood:m,sleep:s};save();render();toast('Check-in saved')}
function addVal(k,v){if(!Number.isFinite(v)||v<=0)return false;S.vitals.push({k,v,t:Date.now()});return true}
function addV(){let k=document.querySelector('#vk').value,raw=document.querySelector('#vv').value.trim();if(k==='bp'){let m=raw.match(/^(\d{2,3})\s*[/x-]\s*(\d{2,3})$/);if(!m)return toast('Use a format like 120/80');if(!addVal('sys',+m[1])||!addVal('dia',+m[2]))return toast('Enter valid blood pressure');}else if(!addVal(k,parseFloat(raw)))return toast('Enter a valid positive number');save();render();toast('Reading saved')}
function quick(){let t=(document.querySelector('#qt')?.value||'').toLowerCase(),n=0,m;if(m=t.match(/(?:bp|blood pressure)\D*(\d{2,3})\D+(\d{2,3})/)){addVal('sys',+m[1]);addVal('dia',+m[2]);n++}[[ 'hr',/(?:heart|pulse|hr)\D*(\d{2,3})/ ],[ 'glu',/(?:sugar|glucose)\D*(\d{2,3})/ ],[ 'spo2',/(?:oxygen|spo2)\D*(\d{2,3})/ ],[ 'wt',/weight\D*(\d{2,3}(?:\.\d)?)/ ]].forEach(([k,r])=>{let x=t.match(r);if(x){addVal(k,+x[1]);n++}});if(!n)return toast('Try “pulse 72” or “blood pressure 120 over 80”');save();render();toast(n+' reading logged')}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input is not supported here');let r=new SR();r.lang='en-IN';r.onresult=e=>{let q=document.querySelector('#qt');if(q){q.value=e.results[0][0].transcript;quick()}};r.onerror=()=>toast('Could not hear you');r.start();toast('Listening…')}
function addMed(){let n=document.querySelector('#mn').value.trim();if(!n)return toast('Enter a medicine name');S.meds.push({name:n,dose:document.querySelector('#md').value.trim(),time:document.querySelector('#mt').value,taken:{}});save();render();checkInter(false)}
function tick(i){let m=S.meds[i],d=TODAY();m.taken=m.taken||{};m.taken[d]=!m.taken[d];save();render()}
function delMed(i){S.meds.splice(i,1);save();render()}
function addAp(){let d=document.querySelector('#ad').value.trim(),dt=document.querySelector('#ai').value;if(!d||!dt)return toast('Add a doctor and date');S.appts.push({doc:d,date:dt,time:document.querySelector('#at').value,note:document.querySelector('#an').value.trim()});save();render();toast('Appointment saved')}
function delAp(i){S.appts.splice(i,1);save();render()}
function saveP(){['name','blood','allergies','conditions','contact','contactPhone'].forEach(k=>S.profile[k]=document.querySelector('#p_'+k).value.trim());save();render();toast('Details saved')}
const INTER=[['warfarin','aspirin','may increase bleeding risk'],['warfarin','ibuprofen','may increase bleeding risk'],['aspirin','ibuprofen','may increase stomach irritation'],['lisinopril','ibuprofen','may affect blood pressure and kidneys'],['sildenafil','nitroglycerin','can cause dangerous low blood pressure'],['simvastatin','clarithromycin','may increase muscle toxicity']];
function checkInter(show){let n=S.meds.map(m=>m.name.toLowerCase()),h=INTER.filter(x=>n.some(v=>v.includes(x[0]))&&n.some(v=>v.includes(x[1])));if(h.length)alert('Possible medicine interactions:\n\n'+h.map(x=>'• '+x[0]+' + '+x[1]+': '+x[2]).join('\n')+'\n\nConfirm with a doctor or pharmacist.');else if(show)toast('No pairs from this basic checker were found')}
const RED=['chest pain','can’t breathe',"can't breathe",'cannot breathe','severe trouble breathing','unconscious','seizure','severe bleeding','face droop','slurred speech','one side weak','vomiting blood','suicidal'];
const SOON=['fever','vomit','diarr','dizz','rash','pain','cough','swelling','infection','blood'];
function triage(){let t=document.querySelector('#sx').value.toLowerCase();if(!t.trim())return toast('Describe your symptoms first');let l,c,m;if(RED.some(x=>t.includes(x))){l='Emergency warning';c='bad';m='Call 112 or seek emergency medical care now. Do not rely on this checker to decide whether an emergency is present.'}else if(SOON.some(x=>t.includes(x))){l='Consider medical advice';c='warn';m='Contact a clinician if symptoms are severe, persistent, worsening, or concerning to you.'}else{l='No emergency red flag detected';c='ok';m='This does not rule out illness. Monitor your symptoms and seek professional care if they worsen or you are unsure.'}document.querySelector('#tr').innerHTML='<div class="card" style="margin-top:12px;background:var(--surface2)"><span class="pill '+c+'">'+l+'</span><p>'+m+'</p><p class="tiny">General information only; not a diagnosis.</p></div>'}
function report(){let p=S.profile,L=['Health summary for '+(p.name||'patient')+' ('+TODAY()+')','Blood group: '+(p.blood||'-')+' | Allergies: '+(p.allergies||'-')+' | Conditions: '+(p.conditions||'-'),''];['hr','sys','dia','glu','spo2','wt'].forEach(k=>{let a=series(k);if(a.length)L.push(R[k][0]+': latest '+a[a.length-1]+' '+R[k][1]+', average '+(a.reduce((x,y)=>x+y)/a.length).toFixed(1))});L.push('','Medicines: '+(S.meds.map(m=>m.name+' '+m.dose+' at '+m.time).join('; ')||'none'));return L.join('\n')}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='pulsecare-data.json';a.click();URL.revokeObjectURL(a.href)}
function erase(){if(confirm('Erase all local data on this device?')){localStorage.removeItem(KEY);S=clone(DEF);save();go('today')}}
let bt;function breathe(){let e=document.querySelector('#br');if(!e)return;clearInterval(bt);let n=0;function step(){let inn=n%2===0;e.style.transform=inn?'scale(1.22)':'scale(1)';e.textContent=inn?'Breathe in':'Breathe out';if(++n>15){clearInterval(bt);e.style.transform='scale(1)';e.textContent='Done'}}step();bt=setInterval(step,4000)}
if(localStorage.getItem('pulsecare_theme'))document.documentElement.setAttribute('data-theme',localStorage.getItem('pulsecare_theme'));
bootAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
