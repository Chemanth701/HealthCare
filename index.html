<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e7c7b"><link rel="manifest" href="manifest.json"><title>Pulse Care</title><style>:root{font-family:system-ui;background:#f1f6f5;color:#0f2a2e}body{margin:0}main{max-width:720px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid #dce7e5;border-radius:18px;padding:16px;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce7e5;display:flex;justify-content:center}nav button{flex:1;max-width:150px;border:0;background:none;padding:14px;color:#0e7c7b}button{border:0;border-radius:10px;padding:10px 14px;background:#d8f0ee;color:#0e7c7b;font-weight:700}button.primary{background:#0e7c7b;color:white}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #dce7e5;border-radius:10px;margin:5px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#5b7276;font-size:14px}</style></head><body><main id="app"></main><nav id="nav"></nav><script>
const DEF={profile:{name:"",blood:"",allergies:"",conditions:""},vitals:[],meds:[],appts:[],checkins:{},tab:"today"};const KEY="pulsecare_v1",DKEY="pulsecare_device_id";let id=localStorage.getItem(DKEY)||crypto.randomUUID();localStorage.setItem(DKEY,id);let S=load();function load(){try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(S));if(navigator.onLine)fetch("/api/state/"+id,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(S),keepalive:true}).catch(()=>{})}async function sync(){try{const r=await fetch("/api/state/"+id);const x=await r.json();if(x.state){S=Object.assign(structuredClone(DEF),x.state);localStorage.setItem(KEY,JSON.stringify(S));render()}}catch{}}const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){document.querySelector("#app").innerHTML=views[S.tab]();document.querySelector("#nav").innerHTML=["today","vitals","meds","care","id"].map(x=>`<button onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}function go(x){S.tab=x;save();render()}function addVital(){let k=document.querySelector("#vk").value,v=Number(document.querySelector("#vv").value);if(!v)return alert("Enter a valid value");if(k==="bp"){let m=document.querySelector("#vv").value.match(/(\d{2,3})\D+(\d{2,3})/);if(!m)return alert("Use 120/80");S.vitals.push({k:"sys",v:+m[1],t:Date.now()},{k:"dia",v:+m[2],t:Date.now()})}else S.vitals.push({k,v,t:Date.now()});save();render()}function addMed(){let n=document.querySelector("#mn").value.trim();if(!n)return;S.meds.push({name:n,dose:document.querySelector("#md").value,time:document.querySelector("#mt").value,taken:{}});save();render()}function tick(i){let d=new Date().toISOString().slice(0,10),m=S.meds[i];m.taken[d]=!m.taken[d];save();render()}function saveProfile(){["name","blood","allergies","conditions"].forEach(k=>S.profile[k]=document.querySelector("#p"+k).value.trim());save();render()}function healthScore(){let n=0,s=0;S.meds.forEach(m=>{n++;if(m.taken[new Date().toISOString().slice(0,10)])s++});return n?Math.round(s/n*100):null}const views={today:()=>`<h1>Pulse Care</h1><p class="muted">Personal health dashboard</p><div class="card"><h2>Health score</h2><strong style="font-size:42px">${healthScore()??"–"}</strong><p class="muted">Medicine adherence score. Guidance only, not a diagnosis.</p></div><div class="grid"><div class="card"><b>${S.vitals.length}</b><p class="muted">Readings</p></div><div class="card"><b>${S.meds.length}</b><p class="muted">Medicines</p></div></div><div class="card"><h3>Cloud sync</h3><p class="muted">Your device-scoped record is stored locally and synced to MongoDB when online.</p></div>`,vitals:()=>`<h1>Vitals</h1><div class="card"><select id="vk"><option value="hr">Heart rate</option><option value="bp">Blood pressure</option><option value="glu">Glucose</option><option value="spo2">Oxygen</option><option value="wt">Weight</option></select><input id="vv" placeholder="Value or 120/80"><button class="primary" onclick="addVital()">Save reading</button></div>${S.vitals.slice().reverse().map(v=>`<div class="card"><b>${esc(v.k)}</b>: ${esc(v.v)} <span class="muted">${new Date(v.t).toLocaleString()}</span></div>`).join("")}`,meds:()=>`<h1>Medicines</h1>${S.meds.map((m,i)=>{let t=m.taken[new Date().toISOString().slice(0,10)];return`<div class="card"><button onclick="tick(${i})">${t?"✓":"○"}</button> <b>${esc(m.name)}</b> ${esc(m.dose)} <span class="muted">${esc(m.time)}</span></div>`}).join("")}<div class="card"><input id="mn" placeholder="Medicine name"><input id="md" placeholder="Dose"><input id="mt" type="time" value="08:00"><button class="primary" onclick="addMed()">Add medicine</button></div>`,care:()=>`<h1>Care</h1><div class="card"><h3>Symptom guidance</h3><textarea id="sx" rows="4" placeholder="Describe symptoms"></textarea><button onclick="triage()">Check urgency</button><p id="result"></p></div><div class="card"><h3>Appointments</h3><p class="muted">Appointment records can be added to this profile through the database API.</p></div>`,id:()=>`<h1>Emergency ID</h1><div class="card"><p><b>${esc(S.profile.name||"Name not set")}</b></p><p>Blood group: ${esc(S.profile.blood||"?")}</p><p>Allergies: ${esc(S.profile.allergies||"none listed")}</p><p>Conditions: ${esc(S.profile.conditions||"none listed")}</p><a href="tel:112"><button>Call 112</button></a></div><div class="card"><input id="pname" placeholder="Full name" value="${esc(S.profile.name)}"><input id="pblood" placeholder="Blood group" value="${esc(S.profile.blood)}"><input id="pallergies" placeholder="Allergies" value="${esc(S.profile.allergies)}"><input id="pconditions" placeholder="Conditions" value="${esc(S.profile.conditions)}"><button class="primary" onclick="saveProfile()">Save details</button></div>`};function triage(){let t=document.querySelector("#sx").value.toLowerCase(),r=/chest pain|can't breathe|cannot breathe|unconscious|seizure|severe bleeding/.test(t)?"Emergency: call 112 or go to an emergency room.":/fever|vomit|dizz|rash|pain|cough/.test(t)?"Consider medical advice if symptoms persist or worsen.":"Monitor symptoms and seek care if they worsen.";document.querySelector("#result").textContent=r}render();sync();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
