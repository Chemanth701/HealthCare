<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b"><meta name="description" content="Pulse Care personal health dashboard">
<link rel="manifest" href="/manifest.json"><title>Pulse Care</title>
<style>
:root{--bg:#f1f6f5;--card:#fff;--ink:#0f2a2e;--mut:#5b7276;--line:#dce7e5;--a:#0e7c7b;--as:#d8f0ee;--bad:#c93b34;--bads:#fbe4e2;--warn:#9a6700;--warns:#fff3d6;--ok:#2f855a;--shadow:0 8px 24px #0f2a2e0d}
:root[data-theme=dark]{--bg:#0b1719;--card:#122428;--ink:#e6f2f1;--mut:#8fa9ad;--line:#21393d;--a:#3cc4be;--as:#153a3b;--bad:#f27b74;--bads:#3a1e1d;--warn:#e7b35a;--warns:#3a2f14;--ok:#6fcf97;--shadow:none}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:auto;padding:20px 16px 112px}h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}h2{font-size:18px;margin:26px 0 10px}h3{font-size:15px;margin:0}.muted{color:var(--mut);font-size:14px}.top,.row{display:flex;align-items:center;gap:12px}.top{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
button,input,textarea,select{font:inherit;color:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--as);color:var(--a);font-weight:700;cursor:pointer}button.primary{background:var(--a);color:#fff}button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}button.danger{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}label{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:10px 0 4px}
.auth{max-width:440px;margin:8vh auto}.auth h1{font-size:34px}.auth .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.auth .brandmark{width:46px;height:46px;border-radius:14px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:24px}.auth .switch{margin-top:14px;text-align:center}.auth .err{color:var(--bad);font-weight:700;margin-top:10px}.userbar{font-size:12px;color:var(--mut);margin-top:5px;max-width:220px;overflow:hidden;text-overflow:ellipsis}.hero{background:linear-gradient(140deg,var(--a),#0a4f5c);color:#fff;border:0;display:flex;gap:18px;align-items:center}.hero .muted{color:#cfe9e7}.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}.ok{background:var(--as);color:var(--ok)}.warn{background:var(--warns);color:var(--warn)}.bad{background:var(--bads);color:var(--bad)}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}nav button{background:transparent;color:var(--mut);flex:1;max-width:130px;padding:9px 4px;font-size:12px}nav button.on{background:var(--as);color:var(--a)}
.navicon{font-size:20px;display:block;line-height:1.1}.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--warn)}
.med.done{opacity:.62}.check{width:30px;height:30px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--a);color:#fff}.med.done .check{background:var(--a)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.toast{position:fixed;z-index:10;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px}
.breath{width:120px;height:120px;border-radius:50%;background:var(--as);margin:16px auto;display:grid;place-items:center;color:var(--a);font-weight:800;transition:transform 4s ease}.breath.in{transform:scale(1.35)}
@media(max-width:520px){.hero{align-items:flex-start}.hero svg{width:90px}.grid{gap:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main id="app" aria-live="polite"></main><nav id="nav" aria-label="Main navigation"></nav>
<script>
const KEY='pulsecare_v1',TODAY=()=>new Date().toISOString().slice(0,10);
const R={hr:['Heart rate','bpm',50,100],sys:['Systolic','mmHg',90,130],dia:['Diastolic','mmHg',60,85],glu:['Glucose','mg/dL',70,140],spo2:['Oxygen','%',95,100],wt:['Weight','kg',0,999]};
const DEF={profile:{name:'',blood:'',allergies:'',conditions:'',contact:'',contactPhone:''},vitals:[],meds:[],appts:[],checkins:{},tab:'today',updatedAt:0};
const clone=o=>JSON.parse(JSON.stringify(o));let S=load(),syncState='local',busy=false,timer;
function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(DEF)}}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function setSync(x){syncState=x;let e=document.querySelector('#syncStatus');if(e)e.innerHTML='<span class="dot '+(x==='offline'?'off':'')+'"></span>'+({synced:'Synced',syncing:'Syncing…',offline:'Offline',local:'Local only'}[x]||x)}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}clearTimeout(timer);timer=setTimeout(push,300)}
async function push(){if(busy||!navigator.onLine||!AUTH)return;busy=true;setSync('syncing');try{let r=await fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(S)});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;setSync('synced')}catch{setSync('offline')}finally{busy=false}}
async function pull(){if(!navigator.onLine||!AUTH)return setSync('offline');setSync('syncing');try{let r=await fetch('/api/state',{credentials:'same-origin'});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;let x=await r.json();if(x.state&&Number(x.updatedAt||0)>Number(S.updatedAt||0)){S=Object.assign(clone(DEF),x.state);localStorage.setItem(KEY,JSON.stringify(S));render()}setSync('synced')}catch{setSync('offline')}}
addEventListener('online',pull);addEventListener('offline',()=>setSync('offline'));
function last(k){let a=S.vitals.filter(v=>v.k===k);return a[a.length-1]}function series(k){return S.vitals.filter(v=>v.k===k).slice(-14).map(v=>v.v)}
function status(k,v){let r=R[k];if(k==='wt')return['ok','Logged'];if(v<r[2])return['warn','Low'];if(v>r[3])return['bad','High'];return['ok','In range']}
function spark(a,w=130,h=38){if(a.length<2)return'';let mn=Math.min(...a),mx=Math.max(...a),d=mx-mn||1,p=a.map((v,i)=>((i/(a.length-1))*(w-4)+2).toFixed(1)+','+(h-4-((v-mn)/d)*(h-8)).toFixed(1)).join(' ');return'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+p+'" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function adherence(){if(!S.meds.length)return null;let t=TODAY();return Math.round(S.meds.filter(m=>m.taken&&m.taken[t]).length/S.meds.length*100)}
function score(){let a=[],ad=adherence();if(ad!==null)a.push(ad);['hr','sys','dia','glu','spo2'].forEach(k=>{let x=last(k);if(x)a.push(status(k,x.v)[0]==='ok'?100:55)});let c=S.checkins[TODAY()];if(c)a.push((c.mood+c.sleep)*10);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
function insights(){let o=[];['hr','sys','glu'].forEach(k=>{let a=series(k);if(a.length>=4){let r=a.slice(-3).reduce((x,y)=>x+y)/3,b=a.slice(0,-3).reduce((x,y)=>x+y)/(a.length-3),ch=(r-b)/b*100;if(Math.abs(ch)>=8)o.push({t:R[k][0]+' is '+(ch>0?'up ':'down ')+Math.abs(ch).toFixed(0)+'% versus earlier readings.',c:Math.abs(ch)>15?'bad':'warn'})}});let ad=adherence();if(ad!==null&&ad<100&&new Date().getHours()>=20)o.push({t:'Some medicines are not marked as taken today.',c:'warn'});if(!o.length)o.push({t:S.vitals.length?'No unusual changes detected in recent readings.':'Log a reading to start seeing trends.',c:'ok'});return o}
let AUTH=null,authMode='login';
function authRender(){document.querySelector('#nav').innerHTML='';document.querySelector('#app').innerHTML='<div class="auth"><div class="card"><div class="brand"><div class="brandmark">♥</div><div><h1>Pulse Care</h1><p class="muted">Private health dashboard</p></div></div><h2>'+(authMode==='login'?'Sign in':'Create account')+'</h2><p class="muted">Your health data is protected by an account session instead of a browser-only device ID.</p><label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="ap" type="password" autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" placeholder="At least 8 characters"><div id="ae2" class="err" role="alert"></div><button class="primary" style="width:100%;margin-top:12px" onclick="authSubmit()">'+(authMode==='login'?'Sign in':'Create account')+'</button><div class="switch"><button class="ghost" onclick="authMode=authMode===\'login\'?\'register\':\'login\';authRender()">'+(authMode==='login'?'New here? Create an account':'Already have an account? Sign in')+'</button></div></div></div>'}
async function authSubmit(){let email=document.querySelector('#ae').value.trim(),password=document.querySelector('#ap').value,err=document.querySelector('#ae2');err.textContent='';try{let r=await fetch('/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})}),x=await r.json();if(!r.ok)throw Error(x.error||'Authentication failed');AUTH=x;S=load();render();pull()}catch(e){err.textContent=e.message}}
async function bootAuth(){try{let r=await fetch('/api/auth/me',{credentials:'same-origin'});if(!r.ok)throw 0;AUTH=await r.json();render();pull()}catch{authRender()}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});AUTH=null;authRender()}
const tabs=[['today','⌂','Today'],['vitals','♥','Vitals'],['meds','✚','Meds'],['care','♡','Care'],['id','▣','Emergency']];
const V={};
V.today=()=>{let sc=score(),ad=adherence(),c=S.checkins[TODAY()],next=S.appts.filter(a=>a.date>=TODAY()).sort((a,b)=>a.date.localeCompare(b.date))[0],h=new Date().getHours(),circ=276;return '<div class="top"><div><p class="muted">'+(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+'</p><h1>'+esc(S.profile.name||'Welcome')+'</h1></div><div style="text-align:right"><div id="syncStatus" class="sync"><span class="dot"></span>Local only</div><div class="userbar">${AUTH?esc(AUTH.email):""} · <button class="ghost" onclick="logout()">Sign out</button></div><button class="ghost" onclick="theme()" style="margin-top:6px">Theme</button></div></div><div class="card hero" style="margin-top:16px"><svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="Health score '+(sc??'not available')+'"><circle cx="55" cy="55" r="44" stroke="#ffffff40" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="44" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-(sc||0)/100))+'" transform="rotate(-90 55 55)"/><text x="55" y="63" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">'+(sc??'–')+'</text></svg><div><h3>Health score</h3><p class="muted">A wellness snapshot from your logged data. It is not a diagnosis.</p></div></div><h2>What we noticed</h2>'+insights().map(i=>'<div class="card"><span class="pill '+i.c+'">'+(i.c==='ok'?'Good':i.c==='warn'?'Watch':'Act')+'</span><p style="margin-top:8px">'+esc(i.t)+'</p></div>').join('')+(ad!==null?'<div class="card"><div class="row" style="justify-content:space-between"><div><h3>Medicine adherence</h3><p class="muted">Today</p></div><b>'+ad+'%</b></div><div class="bar" style="margin-top:10px"><i style="width:'+ad+'%"></i></div></div>':'')+'<div class="grid"><div class="card"><b>'+S.vitals.length+'</b><p class="muted">Readings</p></div><div class="card"><b>'+S.meds.length+'</b><p class="muted">Medicines</p></div></div>'+(next?'<div class="card"><h3>Next appointment</h3><p>'+esc(next.doc)+'</p><p class="muted">'+next.date+' '+esc(next.time||'')+'</p></div>':'')+'<div class="card"><h3>Daily check-in</h3><label>Mood (1–5)</label><input id="mood" type="number" min="1" max="5" value="'+(c?.mood||3)+'"><label>Sleep quality (1–5)</label><input id="slp" type="number" min="1" max="5" value="'+(c?.sleep||3)+'"><button class="primary" style="margin-top:10px" onclick="checkin()">Save check-in</button></div>'};
V.vitals=()=>'<h1>Vitals</h1><p class="muted">Record readings and review recent trends.</p><div class="card"><label for="vk">Reading</label><select id="vk"><option value="hr">Heart rate</option><option value="bp">Blood pressure</option><option value="glu">Glucose</option><option value="spo2">Oxygen</option><option value="wt">Weight</option></select><label for="vv">Value</label><input id="vv" inputmode="decimal" placeholder="e.g. 72 or 120/80"><button class="primary" style="margin-top:8px" onclick="addV()">Save reading</button></div>'+['hr','sys','dia','glu','spo2','wt'].map(k=>{let x=last(k);return x?'<div class="card"><div class="row" style="justify-content:space-between"><div><h3>'+R[k][0]+'</h3><p><b>'+x.v+' '+R[k][1]+'</b> · <span class="pill '+status(k,x.v)[0]+'">'+status(k,x.v)[1]+'</span></p></div>'+spark(series(k))+'</div><p class="muted">Latest: '+new Date(x.t).toLocaleString()+'</p></div>':''}).join('')+'<div class="card"><h3>Quick log</h3><p class="muted">Type a simple phrase such as “pulse 72” or “blood pressure 120 over 80”.</p><input id="qt" placeholder="pulse 72"><button style="margin-top:8px" onclick="quick()">Log text</button><button class="ghost" style="margin-left:6px" onclick="voice()">Voice</button></div>';
V.meds=()=>'<h1>Medicines</h1><p class="muted">Tracking only; follow the prescription from your clinician.</p>'+(S.meds.length?S.meds.map((m,i)=>{let d=m.taken?.[TODAY()];return '<div class="card med '+(d?'done':'')+'"><div class="row"><button class="check" onclick="tick('+i+')" aria-label="'+(d?'Mark '+esc(m.name)+' not taken':'Mark '+esc(m.name)+' taken')+'">'+(d?'✓':'')+'</button><div class="grow"><h3>'+esc(m.name)+'</h3><p class="muted">'+esc(m.dose||'Dose not set')+' · '+esc(m.time||'Time not set')+'</p></div><button class="ghost" onclick="delMed('+i+')">Delete</button></div></div>'}).join(''):'<div class="card"><p class="muted">No medicines added yet.</p></div>')+'<div class="card"><label>Medicine name</label><input id="mn"><label>Dose</label><input id="md" placeholder="e.g. 500 mg"><label>Time</label><input id="mt" type="time" value="08:00"><button class="primary" style="margin-top:10px" onclick="addMed()">Add medicine</button><button class="ghost" style="margin-left:6px" onclick="checkInter(true)">Check interactions</button></div>';
V.care=()=>'<h1>Care</h1><p class="muted">General guidance only. When symptoms are severe or you are unsure, seek professional care.</p><div class="card"><h3>Symptom guidance</h3><textarea id="sx" rows="4" placeholder="Describe symptoms and when they started"></textarea><button class="primary" style="margin-top:8px" onclick="triage()">Check urgency</button><div id="tr"></div></div><h2>Appointments</h2>'+(S.appts.length?S.appts.map((a,i)=>'<div class="card row"><div class="grow"><h3>'+esc(a.doc)+'</h3><p class="muted">'+a.date+' '+esc(a.time||'')+(a.note?' · '+esc(a.note):'')+'</p></div><button class="ghost" onclick="delAp('+i+')">Delete</button></div>').join(''):'<div class="card"><p class="muted">No appointments added.</p></div>')+'<div class="card"><label>Doctor or clinic</label><input id="ad"><label>Date</label><input id="ai" type="date" min="'+TODAY()+'"><label>Time</label><input id="at" type="time"><label>Note</label><input id="an" placeholder="Optional"><button class="primary" style="margin-top:10px" onclick="addAp()">Save appointment</button></div><div class="card"><h3>Wellness reset</h3><div id="br" class="breath">Ready</div><button class="primary" onclick="breathe()">Start breathing</button></div><div class="card"><h3>Share a health summary</h3><p class="muted">You choose whether to share the generated text.</p><button onclick="share()">Share</button><button class="ghost" style="margin-left:6px" onclick="summary()">Copy</button></div>';
V.id=()=>{let p=S.profile;return '<h1>Emergency ID</h1><p class="muted">Keep this information current. This screen is for quick reference, not a substitute for emergency records.</p><div class="card" style="border-color:var(--bad)"><h3>Medical ID</h3><p><b>'+esc(p.name||'Name not set')+'</b> · Blood '+esc(p.blood||'?')+'</p><p>Allergies: '+esc(p.allergies||'none listed')+'</p><p>Conditions: '+esc(p.conditions||'none listed')+'</p><p>Contact: '+esc(p.contact||'not set')+' '+esc(p.contactPhone||'')+'</p>'+(p.contactPhone?'<a href="tel:'+esc(p.contactPhone)+'"><button class="danger" style="margin-top:6px">Call contact</button></a>':'')+'</div><div class="card"><b>India emergency services</b><p class="muted">Call 112 for emergency assistance.</p><a href="tel:112"><button class="danger">Call 112</button></a></div><h2>Edit details</h2><div class="card">'+[['name','Full name'],['blood','Blood group'],['allergies','Allergies'],['conditions','Conditions'],['contact','Emergency contact name'],['contactPhone','Emergency contact phone']].map(x=>'<label for="p_'+x[0]+'">'+x[1]+'</label><input id="p_'+x[0]+'" value="'+esc(p[x[0]])+'">').join('')+'<button class="primary" style="margin-top:10px" onclick="saveP()">Save details</button></div><div class="card"><h3>Data controls</h3><p class="muted">Data is kept in this browser and, when online, synced to your device-scoped server record.</p><button onclick="exp()">Export JSON</button><button class="ghost" style="margin-left:6px" onclick="erase()">Erase all local data</button></div>'};
function render(){document.querySelector('#app').innerHTML=V[S.tab]();document.querySelector('#nav').innerHTML=tabs.map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')" '+(S.tab===x[0]?'aria-current="page"':'')+'><span class="navicon" aria-hidden="true">'+x[1]+'</span>'+x[2]+'</button>').join('');if(S.tab==='today')setSync(syncState);scrollTo(0,0)}
function go(x){S.tab=x;save();render()}function theme(){let d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('pulsecare_theme',d?'light':'dark')}
function checkin(){let m=Math.max(1,Math.min(5,+document.querySelector('#mood').value||3)),s=Math.max(1,Math.min(5,+document.querySelector('#slp').value||3));S.checkins[TODAY()]={mood:m,sleep:s};save();render();toast('Check-in saved')}
function addVal(k,v){if(!Number.isFinite(v)||v<=0)return false;S.vitals.push({k,v,t:Date.now()});return true}
function addV(){let k=document.querySelector('#vk').value,raw=document.querySelector('#vv').value.trim();if(k==='bp'){let m=raw.match(/^(\d{2,3})\s*[/x-]\s*(\d{2,3})$/);if(!m)return toast('Use a format like 120/80');addVal('sys',+m[1]);addVal('dia',+m[2])}else if(!addVal(k,parseFloat(raw)))return toast('Enter a valid positive number');save();render();toast('Reading saved')}
function quick(){let t=document.querySelector('#qt').value.toLowerCase(),n=0,m;if(m=t.match(/(?:bp|blood pressure)\D*(\d{2,3})\D+(\d{2,3})/)){addVal('sys',+m[1]);addVal('dia',+m[2]);n++}[[\'hr\',/(?:heart|pulse|hr)\D*(\d{2,3})/],[\'glu\',/(?:sugar|glucose)\D*(\d{2,3})/],[\'spo2\',/(?:oxygen|spo2)\D*(\d{2,3})/],[\'wt\',/weight\D*(\d{2,3}(?:\.\d)?)/]].forEach(([k,r])=>{let x=t.match(r);if(x){addVal(k,+x[1]);n++}});if(!n)return toast('Try “pulse 72” or “blood pressure 120 over 80”');save();render();toast(n+' reading logged')}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input is not supported here');let r=new SR();r.lang='en-IN';r.onresult=e=>{document.querySelector('#qt').value=e.results[0][0].transcript;quick()};r.onerror=()=>toast('Could not hear you');r.start();toast('Listening…')}
function addMed(){let n=document.querySelector('#mn').value.trim();if(!n)return toast('Enter a medicine name');S.meds.push({name:n,dose:document.querySelector('#md').value.trim(),time:document.querySelector('#mt').value,taken:{}});save();render();checkInter(false)}
function tick(i){let m=S.meds[i],d=TODAY();m.taken=m.taken||{};m.taken[d]=!m.taken[d];save();render()}
function delMed(i){S.meds.splice(i,1);save();render()}
function addAp(){let d=document.querySelector('#ad').value.trim(),dt=document.querySelector('#ai').value;if(!d||!dt)return toast('Add a doctor and date');S.appts.push({doc:d,date:dt,time:document.querySelector('#at').value,note:document.querySelector('#an').value.trim()});save();render();toast('Appointment saved')}
function delAp(i){S.appts.splice(i,1);save();render()}
function saveP(){['name','blood','allergies','conditions','contact','contactPhone'].forEach(k=>S.profile[k]=document.querySelector('#p_'+k).value.trim());save();render();toast('Details saved')}
const INTER=[['warfarin','aspirin','may increase bleeding risk'],['warfarin','ibuprofen','may increase bleeding risk'],['aspirin','ibuprofen','may increase stomach irritation'],['lisinopril','ibuprofen','may affect blood pressure and kidneys'],['sildenafil','nitroglycerin','can cause dangerous low blood pressure'],['simvastatin','clarithromycin','may increase muscle toxicity']];
function checkInter(show){let n=S.meds.map(m=>m.name.toLowerCase()),h=INTER.filter(x=>n.some(v=>v.includes(x[0]))&&n.some(v=>v.includes(x[1])));if(h){}if(h.length)alert('Possible medicine interactions:\n\n'+h.map(x=>'• '+x[0]+' + '+x[1]+': '+x[2]).join('\n')+'\n\nConfirm with a doctor or pharmacist.');else if(show)toast('No pairs from this basic checker were found')}
const RED=['chest pain','can’t breathe',"can't breathe",'cannot breathe','severe trouble breathing','unconscious','seizure','severe bleeding','face droop','slurred speech','one side weak','vomiting blood','suicidal'];
const SOON=['fever','vomit','diarr','dizz','rash','pain','cough','swelling','infection','blood'];
function triage(){let t=document.querySelector('#sx').value.toLowerCase();if(!t.trim())return toast('Describe your symptoms first');let l,c,m;if(RED.some(x=>t.includes(x))){l='Emergency warning';c='bad';m='Call 112 or seek emergency medical care now. Do not rely on this checker to decide whether an emergency is present.'}else if(SOON.some(x=>t.includes(x))){l='Consider medical advice';c='warn';m='Contact a clinician if symptoms are severe, persistent, worsening, or concerning to you.'}else{l='No emergency red flag detected';c='ok';m='This does not rule out illness. Monitor your symptoms and seek professional care if they worsen or you are unsure.'}document.querySelector('#tr').innerHTML='<div class="card" style="margin:12px 0 0"><span class="pill '+c+'">'+l+'</span><p style="margin-top:8px">'+m+'</p><p class="muted">General information only; not a diagnosis.</p></div>'}
function report(){let p=S.profile,L=['Health summary for '+(p.name||'patient')+' ('+TODAY()+')','Blood group: '+(p.blood||'-')+' | Allergies: '+(p.allergies||'-')+' | Conditions: '+(p.conditions||'-'),''];['hr','sys','dia','glu','spo2','wt'].forEach(k=>{let a=series(k);if(a.length)L.push(R[k][0]+': latest '+a[a.length-1]+' '+R[k][1]+', average '+(a.reduce((x,y)=>x+y)/a.length).toFixed(1))});L.push('','Medicines: '+(S.meds.map(m=>m.name+' '+m.dose+' at '+m.time).join('; ')||'none'));return L.join('\n')}
async function summary(){try{await navigator.clipboard.writeText(report());toast('Summary copied')}catch{prompt('Copy summary:',report())}}
function share(){let t=report();if(navigator.share)navigator.share({title:'Health update',text:t}).catch(()=>{});else summary()}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='pulsecare-data.json';a.click();URL.revokeObjectURL(a.href)}
function erase(){if(confirm('Erase all local data on this device?')){localStorage.removeItem(KEY);S=clone(DEF);save();go('today')}}
let bt;function breathe(){let e=document.querySelector('#br');clearInterval(bt);let n=0;function step(){let inn=n%2===0;e.classList.toggle('in',inn);e.textContent=inn?'Breathe in':'Breathe out';if(++n>15){clearInterval(bt);e.classList.remove('in');e.textContent='Done'}}step();bt=setInterval(step,4000)}
if(localStorage.getItem('pulsecare_theme'))document.documentElement.setAttribute('data-theme',localStorage.getItem('pulsecare_theme'));
bootAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
