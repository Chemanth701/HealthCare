kground:transparent;color:var(--mut);display:grid;place-items:center;font-size:16px;line-height:1}.password-toggle:hover{background:var(--soft);color:var(--primary)}.password-toggle[aria-pressed="true"]{color:var(--primary)}</style>

<body>
<div id="root"></div>
<script>
const KEY='pulsecare_v1',TODAY=()=>new Date().toISOString().slice(0,10);
const R={hr:['Heart rate','bpm',50,100],sys:['Systolic','mmHg',90,130],dia:['Diastolic','mmHg',60,85],glu:['Glucose','mg/dL',70,140],spo2:['Oxygen','%',95,100],wt:['Weight','kg',0,999]};
const DEF={profile:{name:'',blood:'',allergies:'',conditions:'',contact:'',contactPhone:''},vitals:[],meds:[],appts:[],checkins:{},tab:'today',updatedAt:0};
const clone=o=>JSON.parse(JSON.stringify(o));let S=load(),syncState='local',busy=false,timer,AUTH=null,authMode='login',authView='entry',menuOpen=false;
function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(DEF)}}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(n){return (String(n||'PC').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'PC').toUpperCase()}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function setSync(x){syncState=x;let e=document.querySelector('#syncStatus');if(e)e.textContent={synced:'● Synced',syncing:'● Syncing…',offline:'● Offline',local:'● Local only'}[x]||x}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}clearTimeout(timer);timer=setTimeout(push,400)}
async function push(){if(busy||!navigator.onLine||!AUTH)return;busy=true;setSync('syncing');try{let r=await fetch('/api/state',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(S)});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;setSync('synced')}catch{setSync('offline')}finally{busy=false}}
async function pull(){if(!navigator.onLine||!AUTH)return setSync('offline');setSync('syncing');try{let r=await fetch('/api/state',{credentials:'same-origin'});if(r.status===401){AUTH=null;authRender();return}if(!r.ok)throw 0;let x=await r.json();if(x.state&&Number(x.updatedAt||0)>Number(S.updatedAt||0)){S=Object.assign(clone(DEF),x.state);localStorage.setItem(KEY,JSON.stringify(S));render()}setSync('synced')}catch{setSync('offline')}}
addEventListener('online',pull);addEventListener('offline',()=>setSync('offline'));

function last(k){let a=S.vitals.filter(v=>v.k===k);return a[a.length-1]}
function series(k){return S.vitals.filter(v=>v.k===k).slice(-14).map(v=>v.v)}
function status(k,v){let r=R[k];if(k==='wt')return['ok','Logged'];if(v<r[2])return['warn','Low'];if(v>r[3])return['bad','High'];return['ok','In range']}
function adherence(){if(!S.meds.length)return null;let t=TODAY();return Math.round(S.meds.filter(m=>m.taken&&m.taken[t]).length/S.meds.length*100)}
function score(){let a=[],ad=adherence();if(ad!==null)a.push(ad);['hr','sys','dia','glu','spo2'].forEach(k=>{let x=last(k);if(x)a.push(status(k,x.v)[0]==='ok'?100:55)});let c=S.checkins[TODAY()];if(c)a.push((c.mood+c.sleep)*10);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
function bars(k){let a=series(k);if(!a.length)return '<div class="empty">No readings yet</div>';let mx=Math.max(...a),mn=Math.min(...a),d=mx-mn||1;return '<div class="chart">'+a.map(v=>'<span style="height:'+Math.max(12,22+((v-mn)/d)*72)+'%"></span>').join('')+'</div>'}
function insights(){let o=[];['hr','sys','glu'].forEach(k=>{let a=series(k);if(a.length>=4){let r=a.slice(-3).reduce((x,y)=>x+y)/3,b=a.slice(0,-3).reduce((x,y)=>x+y)/(a.length-3),ch=(r-b)/b*100;if(Math.abs(ch)>=8)o.push({t:R[k][0]+' is '+(ch>0?'up ':'down ')+Math.abs(ch).toFixed(0)+'% versus earlier readings.',c:Math.abs(ch)>15?'bad':'warn'})}});let ad=adherence();if(ad!==null&&ad<100&&new Date().getHours()>=20)o.push({t:'Some medicines are not marked as taken today.',c:'warn'});if(!o.length)o.push({t:S.vitals.length?'No unusual changes detected in recent readings.':'Log a reading to start seeing trends.',c:'ok'});return o}

const INDIA_STATES=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jammu & Kashmir (UT)','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
function authEntryRender(){authView='entry';document.body.innerHTML=`<div class="auth-wrap"><div class="auth-card auth-choice"><div class="auth-logo">♥</div><p class="eyebrow">Pulse Care</p><h1>Choose how you want to sign in</h1><p class="muted">Use the patient/doctor workspace for healthcare services, or the separate administrator portal for system management.</p><div class="auth-choice-grid"><button class="auth-choice-card" onclick="authView='user';authMode='login';authRender()"><div class="auth-choice-icon">♥</div><h2>User Login</h2><p>Patients and approved doctors can sign in here. New patients and doctor applicants can create an account.</p></button><button class="auth-choice-card" onclick="authView='admin-login';adminLoginRender()"><div class="auth-choice-icon">⚙</div><h2>Admin Login</h2><p>Administrator-only access for doctor verification, emergency tickets and system monitoring.</p></button></div><div class="auth-choice-footer"><span class="tiny">Secure role-based access • Pulse Care</span></div></div></div>`}
function adminLoginRender(){authView='admin-login';document.body.innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="auth-logo">⚙</div><p class="eyebrow">Pulse Care Administration</p><h1>Admin Login</h1><p class="muted">This portal is separate from patient and doctor workspaces.</p><div class="field"><label>Admin email</label><input id="ae" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="ap" type="password" autocomplete="current-password" placeholder="Your admin password" onkeydown="if(event.key==='Enter')authSubmit()"><button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('ap',this)">◉</button></div></div><div id="ae2" class="err" role="alert"></div><button class="btn primary" style="width:100%" onclick="authSubmit()">Sign in as administrator</button><div class="switch"><button class="btn soft" onclick="authEntryRender()">← Back to login selection</button></div><div class="admin-login-note">Admin access is controlled by the server's configured <b>ADMIN_EMAIL</b>. A normal patient or doctor account cannot use this page.</div></div></div>`}
function authRender(){const d=authMode==='register';document.body.innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="auth-logo">♥</div><p class="eyebrow">Pulse Care</p><h1>${d?'Create your account':'Welcome back'}</h1><p class="muted">${d?'Register as a patient or submit a doctor application for admin verification.':'Smart appointments, health records, prescriptions and emergency support.'}</p><div class="field"><label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="ap" type="password" autocomplete="${d?'new-password':'current-password'}" placeholder="At least 8 characters"><button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('ap',this)">◉</button></div></div>${d?'<div class="field"><label>Account type</label><select id="arole" onchange="toggleDoctorRegistration()"><option value="patient">Patient</option><option value="doctor">Doctor</option></select></div><div id="doctorFields" hidden><div class="field"><label>Full name</label><input id="drname" placeholder="Dr. Your Name"></div><div class="form-grid"><div class="field"><label>Specialization</label><input class="select-search" id="drspecSearch" type="search" placeholder="Search specialization..." autocomplete="off" oninput="filterSelect(&quot;drspec&quot;,&quot;drspecSearch&quot;)"><select id="drspec"><option value="">Select specialization</option><option>Addiction Medicine</option><option>Allergy and Immunology</option><option>Anesthesiology</option><option>Cardiology</option><option>Cardiothoracic Surgery</option><option>Critical Care Medicine</option><option>Dentistry</option><option>Dermatology</option><option>Endocrinology</option><option>ENT / Otorhinolaryngology</option><option>Family Medicine</option><option>Gastroenterology</option><option>General Medicine</option><option>General Surgery</option><option>Geriatrics</option><option>Gynecology</option><option>Hematology</option><option>Hepatology</option><option>Infectious Disease</option><option>Internal Medicine</option><option>Nephrology</option><option>Neurology</option><option>Neurosurgery</option><option>Nuclear Medicine</option><option>Obstetrics and Gynecology</option><option>Oncology</option><option>Ophthalmology</option><option>Orthopedics</option><option>Pathology</option><option>Pediatrics</option><option>Plastic Surgery</option><option>Psychiatry</option><option>Pulmonology</option><option>Radiology</option><option>Rheumatology</option><option>Urology</option></select></div><div class="field"><label>Qualification</label><input class="select-search" id="drqualSearch" type="search" placeholder="Search qualification..." autocomplete="off" oninput="filterSelect(&quot;drqual&quot;,&quot;drqualSearch&quot;)"><select id="drqual"><option value="">Select qualification</option><option>BAMS</option><option>BDS</option><option>BHMS</option><option>BMLT</option><option>BOT</option><option>BPT</option><option>BSMS</option><option>BSW</option><option>BSc Nursing</option><option>DNB</option><option>DM</option><option>GNM</option><option>MBBS</option><option>MCh</option><option>MD</option><option>MDS</option><option>MS</option><option>MSW</option><option>PharmD</option><option>PhD</option><option>Other / Custom</option></select></div><div class="field full"><label>Medical registration number</label><input id="drreg" placeholder="Official council registration number" autocomplete="off"></div><div class="field"><label>Phone</label><input id="drphone" type="tel" placeholder="Phone number" autocomplete="tel"></div><div class="field"><label>State</label><input class="select-search" id="drstateSearch" type="search" placeholder="Search state..." autocomplete="off" oninput="filterSelect(&quot;drstate&quot;,&quot;drstateSearch&quot;)"><select id="drstate" onchange="doctorStateChanged()"><option value="">Select state</option></select></div><div class="field"><label>Metropolitan city</label><input class="select-search" id="drlocSearch" type="search" placeholder="Search city..." autocomplete="off" oninput="filterSelect(&quot;drloc&quot;,&quot;drlocSearch&quot;)"><select id="drloc" onchange="doctorCityChanged()" disabled><option value="">Select state first</option></select></div><div class="field"><label>Hospital / clinic</label><input class="select-search" id="drhospSearch" type="search" placeholder="Search hospital..." autocomplete="off" oninput="filterSelect(&quot;drhosp&quot;,&quot;drhospSearch&quot;)"><select id="drhosp" onchange="doctorHospitalChanged()" disabled><option value="">Select city first</option></select><input id="drhospCustom" placeholder="Enter hospital / clinic name" style="display:none;margin-top:8px"></div><div class="field"><label>Experience (years)</label><input class="select-search" id="drexpSearch" type="search" placeholder="Search experience..." autocomplete="off" oninput="filterSelect(&quot;drexp&quot;,&quot;drexpSearch&quot;)"><select id="drexp" onchange="doctorExperienceChanged()"><option value="">Select experience</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="custom">Custom year</option></select><input id="drexpCustom" type="number" min="0" max="80" step="1" placeholder="Enter years" style="display:none;margin-top:8px"></div></div><p class="tiny">Your application will remain <b>Pending Verification</b> until an administrator reviews it.</p></div>':''}<div id="ae2" class="err" role="alert"></div><button class="btn primary" style="width:100%" onclick="authSubmit()">${d?'Submit registration':'Sign in'}</button><div class="switch"><button class="btn soft" onclick="authMode=authMode===&quot;login&quot;?&quot;register&quot;:&quot;login&quot;;authRender()">${d?'Already have an account? Sign in':'New here? Create an account'}</button></div></div></div>`;const stateBox=document.querySelector('#drstate');if(stateBox)setSelectOptions('drstate',INDIA_STATES,'Select state',false);upgradeSearchSelects();
}
function toggleDoctorRegistration(){const d=document.querySelector('#arole')?.value==='doctor',box=document.querySelector('#doctorFields');if(box){box.hidden=!d;if(d)setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'nearest'}),40)}}
const DOCTOR_METRO_CITIES={"Andhra Pradesh":["Visakhapatnam","Vijayawada"],"Arunachal Pradesh":["Itanagar"],"Assam":["Guwahati"],"Bihar":["Patna"],"Chhattisgarh":["Raipur"],"Goa":["Panaji"],"Gujarat":["Ahmedabad","Surat","Vadodara"],"Haryana":["Gurugram","Faridabad"],"Himachal Pradesh":["Shimla"],"Jammu & Kashmir (UT)":["Jammu","Srinagar"],"Jharkhand":["Ranchi","Jamshedpur"],"Karnataka":["Bengaluru","Mysuru","Mangaluru"],"Kerala":["Kochi","Kozhikode","Thiruvananthapuram"],"Madhya Pradesh":["Bhopal","Indore","Jabalpur"],"Maharashtra":["Mumbai","Nagpur","Pune"],"Manipur":["Imphal"],"Meghalaya":["Shillong"],"Mizoram":["Aizawl"],"Nagaland":["Kohima"],"Odisha":["Bhubaneswar"],"Punjab":["Ludhiana","Amritsar"],"Rajasthan":["Jaipur","Udaipur"],"Sikkim":["Gangtok"],"Tamil Nadu":["Chennai","Coimbatore","Madurai"],"Telangana":["Hyderabad","Warangal"],"Tripura":["Agartala"],"Uttar Pradesh":["Lucknow","Kanpur","Noida"],"Uttarakhand":["Dehradun"],"West Bengal":["Kolkata","Siliguri"]};
function doctorStateChanged(){const state=document.querySelector('#drstate')?.value||'';setSelectOptions('drloc',DOCTOR_METRO_CITIES[state]||[],'Select metropolitan city',!(DOCTOR_METRO_CITIES[state]||[]).length);setSelectOptions('drhosp',[],'Select city first',true);resetSelectSearch('drlocSearch');resetSelectSearch('drhospSearch');const c=document.querySelector('#drhospCustom');if(c)c.style.display='none'}
async function doctorCityChanged(){const city=document.querySelector('#drloc')?.value||'',hosp=document.querySelector('#drhosp');if(!hosp)return;if(!city){setSelectOptions('drhosp',[],'Select city first',true);resetSelectSearch('drhospSearch');return}try{const rows=await apiJSON('/api/public/hospitals?location='+encodeURIComponent(city));const hospitals=rows.filter(x=>x&&x.hospital).sort((a,b)=>String(a.hospital).localeCompare(String(b.hospital)));hosp.disabled=!hospitals.length;hosp.innerHTML='<option value="">'+esc(hospitals.length?'Select hospital / clinic':'No hospitals found — use Other / New hospital')+'</option>'+hospitals.map(x=>'<option value="'+esc(x.hospital)+'">'+esc(x.hospital)+'</option>').join('')+'<option value="__custom__">Other / New hospital</option>';refreshSearchSelect('drhosp')}catch(e){console.error('doctor hospital lookup failed',e);hosp.disabled=false;hosp.innerHTML='<option value="">Could not load hospital directory</option><option value="__custom__">Other / New hospital</option>';refreshSearchSelect('drhosp')}}
function doctorHospitalChanged(){const custom=document.querySelector('#drhospCustom'),h=document.querySelector('#drhosp');if(custom)custom.style.display=h?.value==='__custom__'?'block':'none'}
function doctorExperienceChanged(){const c=document.querySelector('#drexpCustom'),e=document.querySelector('#drexp');if(c)c.style.display=e?.value==='custom'?'block':'none'}
function togglePassword(id,button){const input=document.getElementById(id);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-pressed',String(show));button.setAttribute('aria-label',show?'Hide password':'Show password');button.textContent='👁';if(show)input.focus()}async function authSubmit(){const email=document.querySelector('#ae')?.value.trim().toLowerCase()||'',password=document.querySelector('#ap')?.value||'',err=document.querySelector('#ae2');if(err)err.textContent='';if(authView==='admin-login'){try{const r=await fetch('/api/auth/admin-login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})}),x=await r.json().catch(()=>({}));if(!r.ok){if(err)err.textContent=x.error||'Admin authentication failed';return}AUTH=x;S=load();adminRender()}catch(e){if(err)err.textContent=e.message||'Admin authentication failed'}return}const role=document.querySelector('#arole')?.value||'patient',body={email,password,role};if(role==='doctor'){const hs=document.querySelector('#drhosp')?.value||'',hc=document.querySelector('#drhospCustom')?.value.trim()||'',es=document.querySelector('#drexp')?.value||'',ec=document.querySelector('#drexpCustom')?.value;body.name=document.querySelector('#drname')?.value.trim();body.specialization=document.querySelector('#drspec')?.value||'';body.qualification=document.querySelector('#drqual')?.value||'';body.medicalRegistrationNumber=document.querySelector('#drreg')?.value.trim();body.phone=document.querySelector('#drphone')?.value.trim();body.state=document.querySelector('#drstate')?.value||'';body.location=document.querySelector('#drloc')?.value||'';body.hospital=hs==='__custom__'?hc:hs;body.experience=es==='custom'?ec:es||0}try{let r=await fetch('/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),x=await r.json().catch(()=>({}));if(!r.ok){if(err)err.textContent=x.error||'Authentication failed';return}if(authMode==='register'&&role==='doctor'){authMode='login';authView='user';authRender();const e=document.querySelector('#ae2');if(e)e.textContent='Doctor application submitted. It is pending admin verification. You can sign in after approval.';return}AUTH=x;if(AUTH.role==='admin'){adminRender();return}S=load();S.tab='today';render();pull()}catch(e){if(err)err.textContent=e.message||'Authentication failed'}}
async function bootAuth(){try{let r=await fetch('/api/auth/me',{credentials:'same-origin'});if(!r.ok)throw 0;AUTH=await r.json();if(AUTH.role==='admin'){adminRender();return}render();pull()}catch{authEntryRender()}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});AUTH=null;authEntryRender()}
function theme(){let d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('pulsecare_theme',d?'light':'dark')}

const tabs=[['today','⌂','Overview'],['network','⌕','Find Doctors'],['care','◫','Appointments'],['records','▤','Medical Records'],['id','▣','Emergency'],['vitals','♥','Vitals'],['meds','✚','Medicines'],['portal','⚕','Care Team']];
function navHTML(){return tabs.map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')" '+(S.tab===x[0]?'aria-current="page"':'')+'><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join('')}

function pageHead(kicker,title,sub,action){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="actions">'+(action||'')+'</div></div>'}

function today(){let name=S.profile.name||'there',sc=score(),ad=adherence(),next=S.appts.filter(a=>a.date>=TODAY()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],c=S.checkins[TODAY()],h=new Date().getHours();let greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';return pageHead('Health overview',greet+', '+esc(name),'Here is your health journey for today.','<span id="syncStatus" class="tiny">● Local only</span> <button class="btn icon" onclick="logout()" title="Sign out">↪</button>')+'<div class="hero card"><div class="hero-content"><span class="pill" style="background:#ffffff22;color:#fff">Today • '+TODAY()+'</span><h2>Take care of your<br>health, one day at a time.</h2><p>Your personal dashboard brings your vitals, medicines and care plan together.</p><button class="btn" style="background:#fff;color:#4f46e5;border:0" onclick="go(\'vitals\')">Log a reading →</button></div><div class="hero-art"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div></div><div class="section"><div class="grid grid-4"><div class="card stat-card"><div class="stat-icon">♥</div><div><b>'+(S.vitals.length||0)+'</b><p>Total readings</p></div></div><div class="card stat-card"><div class="stat-icon">✚</div><div><b>'+(S.meds.length||0)+'</b><p>Medicines</p></div></div><div class="card stat-card"><div class="stat-icon">◷</div><div><b>'+S.appts.length+'</b><p>Appointments</p></div></div><div class="card stat-card"><div class="stat-icon">★</div><div><b>'+(sc??'—')+'</b><p>Health score</p></div></div></div></div><div class="section two-col"><div class="grid"><div class="card"><div class="card-title"><div><h3>Health journey</h3><span class="tiny">A simple snapshot from your logged data</span></div><span class="pill '+(sc!==null?'ok':'warn')+'">'+(sc!==null?'Updated':'Start logging')+'</span></div><div class="grid grid-2"><div><div class="tiny">Health score</div><div style="font-size:38px;font-weight:900;letter-spacing:-.06em">'+(sc??'—')+'<span style="font-size:14px;color:var(--mut)"> / 100</span></div><div class="progress"><i style="width:'+(sc||0)+'%"></i></div></div><div><div class="tiny">Medicine adherence</div><div style="font-size:38px;font-weight:900;letter-spacing:-.06em">'+(ad!==null?ad:'—')+(ad!==null?'%':'')+'</div><div class="progress"><i style="width:'+(ad||0)+'%"></i></div></div></div></div><div class="card"><div class="card-title"><div><h3>What we noticed</h3><span class="tiny">Recent patterns</span></div></div>'+insights().map(i=>'<div class="list-row"><span class="pill '+i.c+'">'+(i.c==='ok'?'Good':i.c==='warn'?'Watch':'Act')+'</span><div class="grow">'+esc(i.t)+'</div></div>').join('')+'</div></div><div class="grid"><div class="card"><div class="card-title"><h3>Next appointment</h3><button class="btn soft" onclick="go(\'care\')">View all</button></div>'+(next?'<div class="doctor"><div class="doctor-photo">'+initials(next.doc)+'</div><div class="doctor-info"><b>'+esc(next.doc)+'</b><span>'+next.date+' · '+esc(next.time||'Time not set')+'</span></div><span class="availability">Scheduled</span></div>':'<div class="empty">No upcoming appointments.<br><button class="btn primary" style="margin-top:10px" onclick="go(\'care\')">Book appointment</button></div>')+'</div><div class="card"><div class="card-title"><h3>Daily check-in</h3><span class="tiny">Today</span></div><div class="form-grid"><div class="field"><label>Mood 1–5</label><input id="mood" type="number" min="1" max="5" value="'+(c?.mood||3)+'"></div><div class="field"><label>Sleep 1–5</label><input id="slp" type="number" min="1" max="5" value="'+(c?.sleep||3)+'"></div></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="checkin()">Save check-in</button></div></div></div>'}

function vitals(){let cards=['hr','sys','dia','glu','spo2','wt'].map(k=>{let x=last(k);if(!x)return '<div class="card"><div class="metric"><div class="metric-left"><div class="metric-icon">•</div><div><h3>'+R[k][0]+'</h3><div class="tiny">No reading yet</div></div></div></div></div>';let st=status(k,x.v);return '<div class="card"><div class="metric"><div class="metric-left"><div class="metric-icon '+(st[0]==='bad'?'red':st[0]==='warn'?'amber':'')+'">♥</div><div><h3>'+R[k][0]+'</h3><div class="tiny">'+new Date(x.t).toLocaleString()+'</div></div></div><div style="text-align:right"><div class="metric-value">'+x.v+' <span class="tiny">'+R[k][1]+'</span></div><span class="pill '+st[0]+'">'+st[1]+'</span></div></div>'+bars(k)+'</div>'}).join('');return pageHead('Health tracking','Vitals','Record readings and keep an eye on recent trends.')+'<div class="card"><div class="card-title"><div><h3>Log a new reading</h3><span class="tiny">Blood pressure supports the 120/80 format.</span></div></div><div class="form-grid"><div class="field"><label>Reading type</label><select id="vk"><option value="hr">Heart rate</option><option value="bp">Blood pressure</option><option value="glu">Glucose</option><option value="spo2">Oxygen saturation</option><option value="wt">Weight</option></select></div><div class="field"><label>Value</label><input id="vv" inputmode="decimal" placeholder="72 or 120/80"></div></div><div class="form-actions"><button class="btn primary" onclick="addV()">Save reading</button><button class="btn" onclick="quick()">Quick text</button><button class="btn" onclick="voice()">Voice input</button></div><input id="qt" style="margin-top:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--ink)" placeholder="Try: pulse 72 or blood pressure 120 over 80"></div><div class="section"><div class="grid grid-2">'+cards+'</div></div>'}

function meds(){return pageHead('Medication','Medicines','Track your schedule and mark doses as taken.')+'<div class="two-col"><div class="card"><div class="card-title"><div><h3>Today’s medicines</h3><span class="tiny">Tracking only — follow your clinician’s instructions.</span></div><span class="pill '+(adherence()===100?'ok':'warn')+'">'+(adherence()??0)+'% done</span></div><div class="list">'+(S.meds.length?S.meds.map((m,i)=>{let d=m.taken?.[TODAY()];return '<div class="list-row"><button class="btn '+(d?'primary':'soft')+'" style="width:40px;height:40px;padding:0" onclick="tick('+i+')">'+(d?'✓':'○')+'</button><div class="grow"><h3>'+esc(m.name)+'</h3><p>'+esc(m.dose||'Dose not set')+' · '+esc(m.time||'Time not set')+'</p></div><button class="btn danger" onclick="delMed('+i+')">Delete</button></div>'}).join(''):'<div class="empty">No medicines added yet.</div>')+'</div></div><div class="card"><div class="card-title"><h3>Add medicine</h3></div><div class="field"><label>Medicine name</label><input id="mn" placeholder="e.g. Vitamin C"></div><div class="form-grid"><div class="field"><label>Dose</label><input id="md" placeholder="e.g. 500 mg"></div><div class="field"><label>Time</label><input id="mt" type="time" value="08:00"></div></div><div class="form-actions"><button class="btn primary" onclick="addMed()">Add medicine</button><button class="btn" onclick="checkInter(true)">Check interactions</button></div></div></div>'}

async function loadPatientAppointments(){try{const rows=await apiJSON('/api/appointments');S.appts=rows.map(v=>({doc:v.doctorName||v.doctorId,date:v.date,time:v.time,note:v.symptoms||'',status:v.status,appointmentId:v.appointmentId}));const box=document.querySelector('#patientAppointmentsList');if(!box)return;const statusClass=s=>s==='completed'||s==='accepted'?'ok':s==='rejected'||s==='cancelled'?'bad':'warn';box.innerHTML=rows.length?rows.map(v=>'<div class="list-row"><div class="doctor-photo">'+initials(v.doctorName||'D')+'</div><div class="grow"><h3>'+esc(v.doctorName||v.doctorId||'Doctor')+'</h3><p>'+esc(v.date||'')+' · '+esc(v.time||'')+' · '+esc(v.type||'')+'</p><p>'+esc(v.specialization||'')+(v.symptoms?' · '+esc(v.symptoms):'')+'</p><p><b>Appointment:</b> '+esc(v.appointmentId||'—')+'</p></div><span class="pill '+statusClass(v.status)+'">'+esc(v.status||'unknown')+'</span></div>').join(''):'<div class="empty">No appointment requests yet. Open Find Doctors and choose <b>Book now</b>.</div>'}catch(e){const box=document.querySelector('#patientAppointmentsList');if(box)box.innerHTML='<div class="empty">Could not load appointments.</div>';toast(e.message||'Could not load appointments')}}
function care(){return pageHead('Care center','Appointments','Track requests, admin approvals and doctor responses.')+'<div class="two-col"><div class="card"><div class="card-title"><div><h3>Your appointments</h3><span class="tiny">Requests are reviewed by the administrator before the doctor receives them.</span></div><button class="btn soft" onclick="go(&quot;network&quot;)">Find a doctor</button></div><div id="patientAppointmentsList" class="list"><div class="empty">Loading appointments…</div></div></div><div class="grid"><div class="card"><div class="card-title"><h3>Symptom guidance</h3><span class="pill warn">Not a diagnosis</span></div><div class="field"><label>What are you feeling?</label><textarea id="sx" rows="5" placeholder="Describe symptoms and when they started"></textarea></div><button class="btn primary" style="margin-top:10px" onclick="triage()">Check urgency</button><div id="tr"></div></div><div class="card"><div class="card-title"><h3>Wellness reset</h3><span class="tiny">60 seconds</span></div><div id="br" style="width:125px;height:125px;margin:12px auto;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary);font-weight:900;transition:transform 4s ease">Ready</div><button class="btn soft" style="width:100%" onclick="breathe()">Start breathing</button></div></div></div>'}
function emergency(){let p=S.profile;return pageHead('Safety','Emergency ID','Share only the emergency information you choose.','<button class="btn" onclick="exp()">Export</button>')+'<div class="two-col"><div class="card" style="border:1px solid #ffd3d0"><div class="profile-banner"><div class="avatar">'+initials(p.name)+'</div><div><h2>'+esc(p.name||'Name not set')+'</h2><p>Blood group: <b>'+esc(p.blood||'?')+'</b></p></div></div><div class="grid grid-2" style="margin-top:16px"><div><div class="tiny">Allergies</div><b>'+esc(p.allergies||'None listed')+'</b></div><div><div class="tiny">Conditions</div><b>'+esc(p.conditions||'None listed')+'</b></div></div><div class="card" style="margin-top:16px;background:#fff3f2;border-color:#ffd3d0"><div class="tiny">Emergency contact</div><h3>'+esc(p.contact||'Not set')+'</h3><p class="muted">'+esc(p.contactPhone||'No phone number')+'</p>'+(p.contactPhone?'<a href="tel:'+esc(p.contactPhone)+'"><button class="btn danger">Call contact</button></a>':'')+'</div><div class="card" style="margin-top:12px;background:#fff3f2;border-color:#ffd3d0"><h3>India emergency services</h3><p class="muted">For an emergency, call 112.</p><a href="tel:112"><button class="btn danger">Call 112</button></a></div></div><div class="card"><div class="card-title"><div><h3>Medical ID details</h3><span class="tiny">Update when anything changes.</span></div></div><div class="form-grid">'+[['name','Full name'],['blood','Blood group'],['allergies','Allergies'],['conditions','Conditions'],['contact','Emergency contact name'],['contactPhone','Emergency contact phone']].map(x=>'<div class="field"><label>'+x[1]+'</label><input id="p_'+x[0]+'" value="'+esc(p[x[0]])+'"></div>').join('')+'</div><button class="btn primary" style="margin-top:14px" onclick="saveP()">Save details</button><div class="section"><div class="card qr-card" style="background:var(--surface2)"><div class="card-title"><div><h3>Emergency QR</h3><span class="tiny">Create a temporary scan link for emergency personnel.</span></div><button class="btn soft" onclick="shareEmergency()">Create QR</button></div><div id="qrBox" class="qr-box"><span class="tiny">No share link created yet.</span></div></div></div><div class="section"><div class="card" style="background:var(--surface2)"><h3>Data controls</h3><p class="muted">Export your data or erase the local browser copy.</p><button class="btn" onclick="exp()">Export JSON</button><button class="btn danger" style="margin-left:6px" onclick="erase()">Erase local data</button></div></div></div></div>'}
async function shareEmergency(){const box=document.querySelector('#qrBox');if(!box)return;box.innerHTML='<span class="tiny">Creating secure share link…</span>';try{const r=await fetch('/api/emergency/share',{method:'POST',credentials:'same-origin'}),x=await r.json();if(!r.ok)throw Error(x.error||'Could not create link');const url=location.origin+'/emergency.html?token='+encodeURIComponent(x.token);box.innerHTML='<div id="qrcode"></div><p class="tiny">Link expires '+new Date(x.expiresAt).toLocaleDateString()+'.</p>';if(window.QRCode)new QRCode(document.querySelector('#qrcode'),{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.H});box.insertAdjacentHTML('beforeend','<button class="btn" onclick="navigator.clipboard?.writeText('+JSON.stringify(url)+');toast(\'Link copied\')">Copy share link</button>')}catch(e){box.innerHTML='<span class="pill bad">Could not create share link</span>'}}
function apiJSON(url,opts){return fetch(url,Object.assign({credentials:'same-origin',headers:{'content-type':'application/json'}},opts||{})).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Request failed');return x})}
function network(){return pageHead('Care network','Find a doctor','Choose your location step-by-step, then filter by hospital, specialization or doctor.')+'<div class="card"><div class="form-grid"><div class="field">'+selectSearch('State','dst','dstSearch')+'<select id="dst" onchange="locationStateChanged()"><option value="">Select state</option>'+sortedUnique(indiaStates()).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div><div class="field">'+selectSearch('City','dl','dlSearch')+'<select id="dl" onchange="locationCityChanged()" disabled><option value="">Select state first</option></select></div><div class="field">'+selectSearch('Hospital / clinic','dh','dhSearch')+'<select id="dh" disabled><option value="">Select city first</option></select></div><div class="field">'+selectSearch('Specialization','dsp','dspSearch')+'<select id="dsp"><option value="">All specialties</option><option>Addiction Medicine</option><option>Allergy and Immunology</option><option>Anesthesiology</option><option>Cardiology</option><option>Cardiothoracic Surgery</option><option>Critical Care Medicine</option><option>Dentistry</option><option>Dermatology</option><option>Endocrinology</option><option>ENT / Otorhinolaryngology</option><option>Family Medicine</option><option>Gastroenterology</option><option>General Medicine</option><option>General Surgery</option><option>Geriatrics</option><option>Gynecology</option><option>Hematology</option><option>Hepatology</option><option>Infectious Disease</option><option>Internal Medicine</option><option>Nephrology</option><option>Neurology</option><option>Neurosurgery</option><option>Nuclear Medicine</option><option>Obstetrics and Gynecology</option><option>Oncology</option><option>Ophthalmology</option><option>Orthopedics</option><option>Pathology</option><option>Pediatrics</option><option>Plastic Surgery</option><option>Psychiatry</option><option>Pulmonology</option><option>Radiology</option><option>Rheumatology</option><option>Urology</option></select></div><div class="field"><label>Doctor</label><input id="dd" autocomplete="name" placeholder="Doctor name"></div><div class="field full"><label>Symptoms for smart routing</label><input id="sym" placeholder="Skin rash"></div></div><div class="form-actions"><button class="btn primary" onclick="searchDoctors()">Search doctors</button><button class="btn soft" onclick="smartRecommend()">Suggest specialization</button></div><div id="locationHint" class="tiny" style="margin-top:10px">State → City → Hospital. Hospitals come from the city directory; verified doctor profiles are added separately.</div><div id="smartResult"></div></div><div class="section"><div class="card"><div class="card-title"><h3>Available doctors</h3><span id="doctorCount" class="pill ok">Loading…</span></div><div id="doctorList" class="grid grid-3"></div></div></div><div class="booking-panel" id="bookingPanel" hidden><div class="card"><div class="card-title"><div><h3>Book appointment</h3><span id="selectedDoctor" class="pill ok">Select a doctor</span></div><button class="btn" type="button" onclick="closeBookingPanel()">✕ Close</button></div><div class="form-grid"><div class="field"><label>Date</label><input id="bd" type="date" min="'+TODAY()+'"></div><div class="field"><label>Time</label><input id="bt" type="time"></div><div class="field"><label>Consultation type</label><select id="btype"><option>In-person</option><option>Online</option></select></div><div class="field full"><label>Symptoms / reason for visit</label><textarea id="bs" rows="4" maxlength="1000" placeholder="Briefly describe why you want the appointment"></textarea></div></div><div class="form-actions"><button class="btn primary" onclick="bookSelectedDoctor()">Send appointment request</button><span class="tiny">Your request goes to the administrator first. The doctor receives it only after admin approval.</span></div></div></div>'}
function indiaStates(){return INDIA_STATES}
function sortedUnique(a){return [...new Set((a||[]).filter(Boolean).map(String))].sort((x,y)=>x.localeCompare(y))}
function setSelectOptions(id,items,placeholder,disabled){const e=document.querySelector('#'+id);if(!e)return;e.disabled=!!disabled;e.innerHTML='<option value="">'+esc(placeholder)+'</option>'+sortedUnique(items).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');refreshSearchSelect(id)}

const SEARCH_SELECTS={drspec:'drspecSearch',drqual:'drqualSearch',drstate:'drstateSearch',drloc:'drlocSearch',drhosp:'drhospSearch',drexp:'drexpSearch',vk:'vkSearch',dst:'dstSearch',dl:'dlSearch',dh:'dhSearch',dsp:'dspSearch'};let openSearchSelectId='';
function refreshSearchSelect(selectId){const s=document.querySelector('#'+selectId),i=document.querySelector('#'+SEARCH_SELECTS[selectId]),shell=i?.closest('.search-select-shell'),menu=shell?.querySelector('.search-select-menu');if(!s||!i||!shell||!menu)return;const selected=s.options[s.selectedIndex],label=selected&&selected.value?selected.textContent:'';if(!shell.classList.contains('open'))i.value=label;i.disabled=!!s.disabled;shell.classList.toggle('disabled',!!s.disabled);if(shell.classList.contains('open'))renderSearchOptions(selectId)}
function renderSearchOptions(selectId){const s=document.querySelector('#'+selectId),i=document.querySelector('#'+SEARCH_SELECTS[selectId]),shell=i?.closest('.search-select-shell'),menu=shell?.querySelector('.search-select-menu');if(!s||!i||!shell||!menu)return;const q=i.value.trim().toLowerCase(),options=[...s.options].filter(o=>o.value&&(!q||o.textContent.toLowerCase().includes(q))).sort((a,b)=>a.textContent.localeCompare(b.textContent));menu.innerHTML=options.length?options.map(o=>'<div class="search-select-option" role="option" data-value="'+esc(o.value)+'">'+esc(o.textContent)+'</div>').join(''):'<div class="search-select-empty">No matching options</div>';menu.querySelectorAll('.search-select-option').forEach(o=>o.onclick=()=>chooseSearchOption(selectId,o.dataset.value))}
function openSearchSelect(selectId){const i=document.querySelector('#'+SEARCH_SELECTS[selectId]),shell=i?.closest('.search-select-shell');if(!i||!shell||i.disabled)return;if(openSearchSelectId&&openSearchSelectId!==selectId)closeSearchSelect(openSearchSelectId);openSearchSelectId=selectId;shell.classList.add('open');const menu=shell.querySelector('.search-select-menu');if(menu)menu.hidden=false;i.value='';renderSearchOptions(selectId);i.setAttribute('aria-expanded','true')}
function closeSearchSelect(selectId){const i=document.querySelector('#'+SEARCH_SELECTS[selectId]),shell=i?.closest('.search-select-shell');if(!i||!shell)return;shell.classList.remove('open');const menu=shell.querySelector('.search-select-menu');if(menu)menu.hidden=true;i.setAttribute('aria-expanded','false');refreshSearchSelect(selectId);if(openSearchSelectId===selectId)openSearchSelectId=''}
function chooseSearchOption(selectId,value){const s=document.querySelector('#'+selectId);if(!s)return;s.value=value;s.dispatchEvent(new Event('change',{bubbles:true}));closeSearchSelect(selectId)}
function filterSelect(selectId,inputId){renderSearchOptions(selectId)}
function resetSelectSearch(inputId){const i=document.querySelector('#'+inputId);if(i){i.value='';const s=Object.keys(SEARCH_SELECTS).find(k=>SEARCH_SELECTS[k]===inputId);if(s)renderSearchOptions(s)}}

function render(){if(AUTH?.role==='admin'){adminRender();return}let body=S.tab==='today'?today():S.tab==='network'?network():S.tab==='vitals'?vitals():S.tab==='meds'?meds():S.tab==='care'?care():S.tab==='records'?recordsPage():S.tab==='portal'?portal():emergency();document.body.style.overflowX='hidden';document.body.style.overflowY='';document.body.innerHTML='<div id="root">'+shell(body)+'</div>';document.body.style.overflowX='hidden';document.body.style.overflowY='';if(S.tab==='today')setSync(syncState);upgradeSearchSelects();scrollTo(0,0);if(S.tab==='network')setTimeout(loadDoctors,0);if(S.tab==='records')setTimeout(loadRecords,0);if(S.tab==='care')setTimeout(loadPatientAppointments,0);if(S.tab==='portal')setTimeout(()=>AUTH?.role==='doctor'?(loadDoctorPortal(),loadDoctorAvailability()):AUTH?.role==='admin'?loadAdminPortal():null,0)}
function go(x){S.tab=x;menuOpen=false;save();render()}
function toggleMenu(){menuOpen=!menuOpen;const s=document.querySelector(".sidebar"),b=document.querySelector(".menu-toggle"),o=document.querySelector(".menu-backdrop");if(s)s.classList.toggle("open",menuOpen);if(b){b.classList.toggle("open",menuOpen);b.setAttribute("aria-expanded",String(menuOpen));b.setAttribute("aria-label",menuOpen?"Close menu":"Open menu")}if(o)o.hidden=!menuOpen;document.body.style.overflow=menuOpen?"hidden":""}
function toggleChat(){const e=document.querySelector("#aiChat");if(!e)return;e.hidden=!e.hidden;if(!e.hidden)document.querySelector("#aiInput")?.focus()}
function aiAdd(role,msg){const b=document.querySelector("#aiMessages");if(!b)return;const e=document.createElement("div");e.className="ai-msg "+role;e.textContent=msg;b.appendChild(e);b.scrollTop=b.scrollHeight}
function aiQuick(msg){const i=document.querySelector("#aiInput");if(i)i.value=msg;sendAI({preventDefault:function(){}})}
function aiAnswer(q){const t=String(q||"").trim().toLowerCase();const emergencySignals=/\b(chest pain|severe chest|cannot breathe|difficulty breathing|trouble breathing|shortness of breath|unconscious|passed out|seizure|severe bleeding|bleeding heavily|stroke|face droop|slurred speech|one side weak|suicidal|overdose|poisoning|anaphylaxis|severe allergic|ambulance|emergency|urgent help|help me now)\b/.test(t);if(emergencySignals)return{reply:"Emergency priority: if there is immediate danger, call 112 now or go to the nearest emergency department. I can create a high-priority emergency ticket, but the ticket must never delay emergency care.",ticket:true,priority:"critical"};if(/\b(appointment|appointments|book|booking|schedule|reschedule|cancel|clinic visit)\b/.test(t))return{reply:"I can help with appointment workflows. Opening Appointments.",go:"care"};if(/\b(doctor|specialist|physician|cardiologist|dermatologist|surgeon|find doctor|search doctor)\b/.test(t))return{reply:"I can help you find a verified doctor. Opening Find Doctors.",go:"network"};if(/\b(vital|vitals|blood pressure|bp|pulse|heart rate|oxygen|spo2|glucose|sugar|weight)\b/.test(t))return{reply:"Opening Vitals so you can review or log health readings.",go:"vitals"};if(/\b(medicine|medicines|medication|medications|dose|dosage|pill|tablet|adherence)\b/.test(t))return{reply:"Opening Medicines so you can review medicines and adherence.",go:"meds"};if(/\b(record|records|medical history|prescription|prescriptions|diagnosis)\b/.test(t))return{reply:"Opening Medical Records.",go:"records"};if(/\b(emergency id|medical id|blood group|allergies|emergency contact)\b/.test(t))return{reply:"Opening Emergency ID.",go:"id"};if(/\b(privacy|terms|legal)\b/.test(t))return{reply:"Use the menu to open Privacy Policy or Terms & Conditions."};if(/\b(dark|light|theme|appearance)\b/.test(t)){theme();return{reply:"Done. I switched the appearance setting."}}if(/\b(menu|sidebar|navigation|navigate)\b/.test(t))return{reply:"Use the menu button at the top-left for all sections. On mobile, the bottom navigation provides quick access."};if(/\b(hello|hi|hey|help|what can you do)\b/.test(t))return{reply:"Hello. I am Care AI. I can guide you through doctors, appointments, records, vitals, medicines, Emergency ID and emergency-ticket workflows. I do not diagnose or replace a clinician."};return{reply:"I can guide you through doctors, appointments, records, vitals, medicines, Emergency ID, navigation and emergency tickets. For a medical emergency, call 112 immediately."}}
async function sendAI(ev){ev.preventDefault();const i=document.querySelector("#aiInput"),q=i?.value.trim();if(!q)return;aiAdd("user",q);i.value="";const a=aiAnswer(q);aiAdd("bot",a.reply);if(a.ticket){const b=document.querySelector("#aiMessages");if(document.querySelector("#ticketMessage"))return;const box=document.createElement("div");box.className="ticket-box";box.innerHTML="<h4>High-priority emergency ticket</h4><p>Emergency tickets are placed ahead of routine support. If someone is in immediate danger, call 112 now.</p><textarea id=\"ticketMessage\" rows=\"3\" maxlength=\"2000\" placeholder=\"Briefly describe what is happening…\"></textarea><div class=\"form-actions\"><button class=\"btn danger\" onclick=\"raiseTicket()\">Create emergency ticket</button><a class=\"btn\" href=\"tel:112\">Call 112</a></div>";b?.appendChild(box);if(b)b.scrollTop=b.scrollHeight;document.querySelector("#ticketMessage")?.focus();return}if(a.go){go(a.go);toggleChat();return}}
function checkin(){let m=Math.max(1,Math.min(5,+document.querySelector('#mood').value||3)),s=Math.max(1,Math.min(5,+document.querySelector('#slp').value||3));S.checkins[TODAY()]={mood:m,sleep:s};save();render();toast('Check-in saved')}
function addVal(k,v){if(!Number.isFinite(v)||v<=0)return false;S.vitals.push({k,v,t:Date.now()});return true}
function addV(){let k=document.querySelector('#vk').value,raw=document.querySelector('#vv').value.trim();if(k==='bp'){let m=raw.match(/^(\d{2,3})\s*[/x-]\s*(\d{2,3})$/);if(!m)return toast('Use a format like 120/80');if(!addVal('sys',+m[1])||!addVal('dia',+m[2]))return toast('Enter valid blood pressure');}else if(!addVal(k,parseFloat(raw)))return toast('Enter a valid positive number');save();render();toast('Reading saved')}
function quick(){let t=(document.querySelector('#qt')?.value||'').toLowerCase(),n=0,m;if(m=t.match(/(?:bp|blood pressure)\D*(\d{2,3})\D+(\d{2,3})/)){addVal('sys',+m[1]);addVal('dia',+m[2]);n++}[[ 'hr',/(?:heart|pulse|hr)\D*(\d{2,3})/ ],[ 'glu',/(?:sugar|glucose)\D*(\d{2,3})/ ],[ 'spo2',/(?:oxygen|spo2)\D*(\d{2,3})/ ],[ 'wt',/weight\D*(\d{2,3}(?:\.\d)?)/ ]].forEach(([k,r])=>{let x=t.match(r);if(x){addVal(k,+x[1]);n++}});if(!n)return toast('Try “pulse 72” or “blood pressure 120 over 80”');save();render();toast(n+' reading logged')}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input is not supported here');let r=new SR();r.lang='en-IN';r.onresult=e=>{let q=document.querySelector('#qt');if(q){q.value=e.results[0][0].transcript;quick()}};r.onerror=()=>toast('Could not hear you');r.start();toast('Listening…')}
function addMed(){let n=document.querySelector('#mn').value.trim();if(!n)return toast('Enter a medicine name');S.meds.push({name:n,dose:document.querySelector('#md').value.trim(),time:document.querySelector('#mt').value,taken:{}});save();render();checkInter(false)}
function tick(i){let m=S.meds[i],d=TODAY();m.taken=m.taken||{};m.taken[d]=!m.taken[d];save();render()}
function delMed(i){S.meds.splice(i,1);save();render()}
function addAp(){let d=document.querySelector('#ad').value.trim(),dt=document.querySelector('#ai').value;if(!d||!dt)return toast('Add a doctor and date');S.appts.push({doc:d,date:dt,time:document.querySelector('#at').value,note:document.querySelector('#an').value.trim()});save();render();toast('Appointment saved')}
function delAp(i){S.appts.splice(i,1);save();render()}
function saveP(){['name','blood','allergies','conditions','contact','contactPhone'].forEach(k=>S.profile[k]=document.querySelector('#p_'+k).value.trim());save();render();toast('Details saved')}
const INTER=[['warfarin','aspirin','may increase bleeding risk'],['warfarin','ibuprofen','may increase bleeding risk'],['aspirin','ibuprofen','may increase stomach irritation'],['lisinopril','ibuprofen','may affect blood pressure and kidneys'],['sildenafil','nitroglycerin','can cause dangerous low blood pressure'],['simvastatin','clarithromycin','may increase muscle toxicity']];
function checkInter(show){let n=S.meds.map(m=>m.name.toLowerCase()),h=INTER.filter(x=>n.some(v=>v.includes(x[0]))&&n.some(v=>v.includes(x[1])));if(h.length)alert('Possible medicine interactions:\n\n'+h.map(x=>'• '+x[0]+' + '+x[1]+': '+x[2]).join('\n')+'\n\nConfirm with a doctor or pharmacist.');else if(show)toast('No pairs from this basic checker were found')}
const RED=['chest pain','can’t breathe',"can't breathe",'cannot breathe','severe trouble breathing','unconscious','seizure','severe bleeding','face droop','slurred speech','one side weak','vomiting blood','suicidal'];
const SOON=['fever','vomit','diarr','dizz','rash','pain','cough','swelling','infection','blood'];
function triage(){let t=document.querySelector('#sx').value.toLowerCase();if(!t.trim())return toast('Describe your symptoms first');let l,c,m;if(RED.some(x=>t.includes(x))){l='Emergency warning';c='bad';m='Call 112 or seek emergency medical care now. Do not rely on this checker to decide whether an emergency is present.'}else if(SOON.some(x=>t.includes(x))){l='Consider medical advice';c='warn';m='Contact a clinician if symptoms are severe, persistent, worsening, or concerning to you.'}else{l='No emergency red flag detected';c='ok';m='This does not rule out illness. Monitor your symptoms and seek professional care if they worsen or you are unsure.'}document.querySelector('#tr').innerHTML='<div class="card" style="margin-top:12px;background:var(--surface2)"><span class="pill '+c+'">'+l+'</span><p>'+m+'</p><p class="tiny">General information only; not a diagnosis.</p></div>'}
function report(){let p=S.profile,L=['Health summary for '+(p.name||'patient')+' ('+TODAY()+')','Blood group: '+(p.blood||'-')+' | Allergies: '+(p.allergies||'-')+' | Conditions: '+(p.conditions||'-'),''];['hr','sys','dia','glu','spo2','wt'].forEach(k=>{let a=series(k);if(a.length)L.push(R[k][0]+': latest '+a[a.length-1]+' '+R[k][1]+', average '+(a.reduce((x,y)=>x+y)/a.length).toFixed(1))});L.push('','Medicines: '+(S.meds.map(m=>m.name+' '+m.dose+' at '+m.time).join('; ')||'none'));return L.join('\n')}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='pulsecare-data.json';a.click();URL.revokeObjectURL(a.href)}
function erase(){if(confirm('Erase all local data on this device?')){localStorage.removeItem(KEY);S=clone(DEF);save();go('today')}}
let bt;function breathe(){let e=document.querySelector('#br');if(!e)return;clearInterval(bt);let n=0;function step(){let inn=n%2===0;e.style.transform=inn?'scale(1.22)':'scale(1)';e.textContent=inn?'Breathe in':'Breathe out';if(++n>15){clearInterval(bt);e.style.transform='scale(1)';e.textContent='Done'}}step();bt=setInterval(step,4000)}
if(localStorage.getItem('pulsecare_theme'))document.documentElement.setAttribute('data-theme',localStorage.getItem('pulsecare_theme'));
bootAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
